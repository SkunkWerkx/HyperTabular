name: CI — build native, build wasm, test every binding

# The forge's pipeline (SkunkWerkx/.github): the core built fresh on five real-hardware
# legs, both musl RIDs and a cross-built Intel macOS, its own suite run on each, the
# libraries attested and uploaded as `native-{rid}`, the nine static libraries built, and
# every binding run against that leg's library — Ruby twice, on Fiddle and on the Magnus
# extension. Every binding the forge knows is on.
#
# Beside it, as in HyperCast, the checks that are this repo's own: rust/check-core.sh,
# which proves on the library itself that the core has no standard library, no allocation
# and no panic.
#
# No `push` trigger, as in every Hyper* repo: a PR run and a manual one are enough.
on:
  pull_request:
  workflow_dispatch:
  # The whole release-mode board once a week, so arm64, musl, iOS, the wheels and the second
  # Ruby ABI are exercised between releases instead of first on release day.
  schedule:
    - cron: "0 6 * * 1"

# A new push to a PR supersedes its running board; anything else runs to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-native:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-native.yml@master
    permissions:            # attestation signs with OIDC; a reusable workflow
      contents: read        # can never escalate beyond its caller's grant
      id-token: write
      attestations: write
    with:
      # pr: every leg and suite, nothing only a release needs (see the forge's README).
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      project: HyperTabular
      crate: hypertabular
      pure_env: HYPERTABULAR_PURE
      csharp_test_project: csharp/HyperTabular.Tests/HyperTabular.Tests.csproj
      csharp_aot_project: csharp/HyperTabular.AotSmokeTest/HyperTabular.AotSmokeTest.csproj
      csharp_runtimes_dir: csharp/HyperTabular/runtimes
      dotnet_version: "11.0.x"
      dotnet_quality: "preview"
      # Explicit placement, as HyperCast does it: the forge puts this leg's library at
      # src/main/resources/native/{rid}/ — where the shipped jar carries it — and the
      # Gradle dev loop, which would otherwise stage whatever rust/target/release holds
      # by then, stands down.
      java_resources_dir: java/src/main/resources/native
      # Four more static libraries in the static-libs artifact: iOS, the iOS simulator and
      # Mac Catalyst (test-apple-mobile, below, is what links and runs them).
      apple_mobile: true
      # Android: the shared library for android-arm64 and android-x64 (what a C# app on
      # CoreCLR loads out of its APK), and in static-libs their archives for C#'s Native AOT,
      # Go's go/staticlib and Swift's bundle. test-android, below, is what runs them.
      android: true
      # The core as a wasm32-wasip1 module too, on every leg: the Java suite runs a second
      # time through its in-process GraalWasm backend (`./gradlew testWasm`).
      wasip1_module: true
      # A second Ruby minor the Magnus extension is built and tested against, so each
      # platform gem carries two ABIs (3.4 and the forge's 4.0), as HyperCast's do.
      ruby_compat_version: "3.4"

  # WebAssembly, through the forge: the core as a wasm32 static library for the NuGet
  # package's browser-wasm asset, the C# binding in a Blazor app, the crate's own
  # wasm-bindgen tests and the Go binding under TinyGo, each in headless Chrome; and the Ruby
  # binding's Magnus extension for wasm32-wasip1, linked into ruby.wasm, under Node and Chrome
  # (release mode only: weekly and at release, not on PRs).
  build-wasm:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wasm.yml@master
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # pr: every leg and suite, nothing only a release needs (see the forge's README).
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypertabular
      project: HyperTabular
      blazor_check: csharp/HyperTabular.WasmSmokeTest/check.sh
      rust_browser_test: rust/browser-test
      go_tinygo_smoke: go/internal/tinygosmoke
      ruby_wasm_smoke: ruby/wasm-smoke

  # The nine PyPI wheels — eight native, and Pyodide's, whose job runs the whole suite in
  # Pyodide under Node and in headless Chrome — built, installed and attested here, and
  # published unchanged by release.yml.
  build-wheels:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wheels.yml@master
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # pr: the Pyodide wheel and its in-browser suite only; the native wheels are packaging.
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypertabular

  check-core:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      # The other architecture's library is only type-checked, which needs its target
      # and nothing else: nothing is linked for it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools
          targets: thumbv7em-none-eabi, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, wasm32-unknown-unknown

      - name: The core is no_std, allocation-free and panic-free
        run: ./check-core.sh

      # With the `async` feature, which only adds to the Rust API: its tests are the
      # asynchronous reads' (tests/header_first.rs).
      - name: cargo test
        run: cargo test --features async

      # The crate, its fuzz targets and its browser test crate, as HyperCast's lint-rust has
      # them. The ruby and php features need their interpreters' headers to compile at all;
      # the forge builds both on every leg.
      - name: cargo fmt --check
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path fuzz/Cargo.toml
          cargo fmt --check --manifest-path browser-test/Cargo.toml

      - name: cargo clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features async -- -D warnings
          cargo clippy --no-default-features --features cdylib -- -D warnings
          cargo clippy --features python -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path browser-test/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings

  # rust-version in rust/Cargo.toml is a promise to every crates.io consumer, and nothing
  # else would notice it going stale: the library and the no_std shared library are built
  # on exactly that toolchain, read from the manifest so the two cannot drift apart. The
  # tests are not part of the promise and use newer APIs. HyperCast's job, unchanged.
  check-msrv:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rust/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: cargo check on rust-version
        working-directory: rust
        run: |
          cargo check --lib
          cargo check --lib --features async
          cargo check --lib --no-default-features --features cdylib

  # Each binding's formatter and doc linter, every PR, over all of its code — library,
  # tests, benchmarks and smoke tests — against the config committed beside it. Static analysis only,
  # no native build needed. (Rust's are check-core's cargo fmt and clippy.)
  lint-go:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go install github.com/mgechev/revive@v1.16.0
      - working-directory: go
        run: revive -config revive.toml ./...
      # Which archive each platform's build links, iOS, Mac Catalyst, Android and the one that
      # must not compile included; the script has why this needs holding to a table.
      - name: Every Go build selects its own platform's archive
        run: .github/scripts/check_go_archives.sh
      - name: gofmt
        working-directory: go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted (run gofmt -w .): $unformatted"
            exit 1
          fi

  lint-python:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.5
      # Docstrings and formatting over the whole package (pyproject.toml's [tool.ruff]).
      - working-directory: python
        run: ruff check .
      - working-directory: python
        run: ruff format --check .

  lint-php:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ffi
      - working-directory: php
        run: composer install --no-progress --prefer-dist
      # phpcs.xml: PSR-12 over src and tests, doc comments on the public API.
      - working-directory: php
        run: vendor/bin/phpcs

  lint-ruby:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ruby
      - working-directory: ruby
        run: bundle exec rake docs:check
      # .rubocop.yml: layout only, over every Ruby file in the gem.
      - working-directory: ruby
        run: bundle exec rubocop

  format-csharp:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-quality: preview
      # csharp/.editorconfig: tabs, LF, a final newline.
      - working-directory: csharp
        run: dotnet format whitespace HyperTabular.slnx --verify-no-changes

  format-java:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # Spotless with palantir-java-format (java/build.gradle.kts).
      - working-directory: java
        run: ./gradlew --no-daemon spotlessCheck

  format-swift:
    runs-on: ubuntu-26.04
    # swift-format ships in the toolchain, so the formatter is the version of the Swift the
    # matrix builds with (the forge's swift_version).
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      # swift/.swift-format: 4-space indent, 120 columns, every lint rule off — layout only.
      - working-directory: swift
        run: >-
          swift format lint --strict --recursive
          Package.swift Sources Tests
          StaticSmokeTest/Package.swift StaticSmokeTest/Sources
          Benchmarks/Package.swift Benchmarks/Benchmarks


  # iOS and Mac Catalyst, for the three bindings that reach them. Neither platform loads a
  # library: the core is linked into the app, from the static libraries build-native's
  # build-static-libs job cross-compiles and attests (the forge's apple_mobile input), which
  # are the bytes stage-native-binaries.yml commits for Swift and Go and release.yml packs for
  # C#. This job is the one place they are linked into something and run, and it needs what
  # no build-native leg carries: Xcode, a simulator, and the .NET ios and maccatalyst
  # workloads. Ported from HyperUuid's job of the same name.
  #
  #  * Swift takes them from swift/HyperTabularCoreApple.xcframework, which swift/Package.swift
  #    declares only when it is there. The binding's suite runs on an iOS simulator and as a
  #    Mac Catalyst process, and the package is built for an iOS device. It also runs once
  #    more for macOS itself, and the root manifest is built: with the XCFramework present
  #    the manifest declares a second binary target and puts a platform condition on the
  #    first, which is the package a macOS consumer resolves from a tag and the one shape of
  #    it build-native's macOS leg, whose tree has no XCFramework yet, never sees.
  #  * C# takes them from csharp/HyperTabular/staticlibs/{rid}/ through
  #    build/net11.0/HyperTabular.targets. HyperTabular.AppleSmokeTest is the Native AOT smoke
  #    test's Program.cs as an app: run as a Mac Catalyst process, installed and launched in
  #    the simulator, and built for an iOS device with signing off. No runner has a device,
  #    so that last one is proved as far as a link goes: the app's executable must define
  #    the core's symbols.
  #  * Go takes them from go/staticlib/, picked by build tag (lint-go checks the picking
  #    for every platform). The suite runs in the simulator through Go's own wrapper,
  #    misc/ios/go_ios_exec.go, which is how the Go project tests its iOS port. The wrapper
  #    carries the module's files and testdata directories into the simulator and nothing
  #    above the module, so the corpus is staged as go/testdata/corpus (corpus_test.go looks
  #    there too). Two are skipped: the test that reads rust/Cargo.toml, and ExampleWorkbook,
  #    which opens ../corpus by its path as the documentation shows it. A device build is
  #    linked and inspected. Mac Catalyst is not linked from Go here: the same archive is
  #    linked and run by Swift and C# above, and Go's part of it is the selection.
  #
  # The simulator hands back neither an exit code nor a console to a launched app, so the C#
  # app also writes what it prints to a file in its container (SmokeLog.cs) and that file is
  # what is checked.
  test-apple-mobile:
    needs: build-native
    # 28 minutes of simulators, behind the slowest build-native leg: release mode only.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    env:
      APP_ID: io.github.skunkwerkx.hypertabular.applesmoketest
      SMOKE_PROJECT: csharp/HyperTabular.AppleSmokeTest/HyperTabular.AppleSmokeTest.csproj
      SMOKE_BIN: csharp/HyperTabular.AppleSmokeTest/bin/Release
    steps:
      - uses: actions/checkout@v7

      # Over the checkout: the artifact is laid out by repository path, so the XCFramework
      # lands whole under swift/, the C# archives under csharp/HyperTabular/staticlibs/ and the
      # Go ones under go/staticlib/.
      - uses: actions/download-artifact@v8
        with:
          name: static-libs
          path: .

      - name: What is installed, and what was staged
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          (cd swift && xcodebuild -list)
          find swift/HyperTabularCoreApple.xcframework -type f | sort
          ls csharp/HyperTabular/staticlibs/{ios-arm64,iossimulator-arm64,maccatalyst-arm64,maccatalyst-x64}/libhypertabular.a
          ls go/staticlib/{ios_arm64,iossimulator_arm64,maccatalyst_arm64,maccatalyst_amd64}/libhypertabular.a

      - name: Boot an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.rsplit("iOS", 1)[-1])]
          for runtime in sorted((r for r in devices if "SimRuntime.iOS" in r), key=version, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("no available iPhone simulator on this image")')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Swift — macOS, with the XCFramework declared
        run: |
          set -euo pipefail
          described=$(cd swift && swift package describe)
          grep -q "HyperTabularCoreApple" <<<"$described" \
            || { echo "::error::swift/Package.swift did not declare the XCFramework target"; exit 1; }
          (cd swift && swift test)
          swift build

      - name: Swift — the suite on the iOS simulator
        if: ${{ !cancelled() }}
        working-directory: swift
        run: xcodebuild test -scheme HyperTabular -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"

      - name: Swift — the suite as a Mac Catalyst process
        if: ${{ !cancelled() }}
        working-directory: swift
        run: xcodebuild test -scheme HyperTabular -destination "platform=macOS,variant=Mac Catalyst"

      - name: Swift — the package builds for an iOS device
        if: ${{ !cancelled() }}
        working-directory: swift
        run: xcodebuild build -scheme HyperTabular -destination "generic/platform=iOS"

      - uses: actions/setup-go@v7
        if: ${{ !cancelled() }}
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Go — the suite in the iOS simulator
        if: ${{ !cancelled() }}
        working-directory: go
        run: |
          set -euo pipefail
          # `go test` hands a cross-built test binary to go_{GOOS}_{GOARCH}_exec when one is
          # on PATH; Go's wrapper installs it in the booted simulator and runs it there.
          # clangwrap.sh is Go's own too, and targets the simulator SDK. The wrapper predates
          # modules: it copies the package into the app by its path under GOROOT or GOPATH and
          # stops if it is under neither, so it alone runs with the workspace as its GOPATH
          # (go test keeps the real one, and its module cache).
          mkdir -p "$RUNNER_TEMP/go-ios/bin" testdata
          cp -R ../corpus testdata/corpus
          go build -o "$RUNNER_TEMP/go-ios/go_ios_exec" "$(go env GOROOT)/misc/ios/go_ios_exec.go"
          printf '#!/bin/sh\nGOPATH=%q exec %q "$@"\n' "$GITHUB_WORKSPACE" "$RUNNER_TEMP/go-ios/go_ios_exec" \
            > "$RUNNER_TEMP/go-ios/bin/go_ios_arm64_exec"
          chmod +x "$RUNNER_TEMP/go-ios/bin/go_ios_arm64_exec"
          export PATH="$RUNNER_TEMP/go-ios/bin:$PATH"
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 CC="$(go env GOROOT)/misc/ios/clangwrap.sh" \
            go test -tags iossimulator -skip '^(TestNativeVersionIsTheCratesVersion|ExampleWorkbook)$' -v . | tee "$RUNNER_TEMP/go-ios/test.log"
          grep -q '^ok' "$RUNNER_TEMP/go-ios/test.log"

      - name: Go — an iOS device build links the core in
        if: ${{ !cancelled() }}
        working-directory: go
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-ios"
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 \
            CC="$(xcrun --sdk iphoneos --find clang) -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=12.0" \
            go test -c -o "$RUNNER_TEMP/go-ios/hypertabular-device.test" .
          nm "$RUNNER_TEMP/go-ios/hypertabular-device.test" > "$RUNNER_TEMP/go-ios/device-symbols.txt"
          grep -q " [Tt] _hypertabular_workbook_fill\$" "$RUNNER_TEMP/go-ios/device-symbols.txt" \
            || { echo "::error::the iOS device test binary does not define hypertabular_workbook_fill; the core was not linked in"; exit 1; }
          echo "the iOS device test binary defines the core's exports"

      # .NET 11, as build-native's legs take it: HyperTabular's floor, preview until the pinned
      # SDK in global.json goes GA.
      - uses: actions/setup-dotnet@v6
        if: ${{ !cancelled() }}
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"

      - name: Install the .NET iOS and Mac Catalyst workloads
        if: ${{ !cancelled() }}
        run: dotnet workload install ios maccatalyst

      - name: C# — a Mac Catalyst app, built and run
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          dotnet build "$SMOKE_PROJECT" -c Release -f net11.0-maccatalyst -r maccatalyst-arm64
          app=$(find "$SMOKE_BIN/net11.0-maccatalyst/maccatalyst-arm64" -maxdepth 1 -name '*.app')
          log="$TMPDIR/hypertabular-smoke.log"
          rm -f "$log"
          "$app/Contents/MacOS/HyperTabular.AppleSmokeTest"
          cat "$log"
          grep -q "ok   native library $want" "$log"
          grep -q "^all ok" "$log"

      - name: C# — an iOS app, installed and launched in the simulator
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          udid="${{ steps.sim.outputs.udid }}"
          dotnet build "$SMOKE_PROJECT" -c Release -f net11.0-ios -r iossimulator-arm64
          app=$(find "$SMOKE_BIN/net11.0-ios/iossimulator-arm64" -maxdepth 1 -name '*.app')
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" "$APP_ID"
          log="$(xcrun simctl get_app_container "$udid" "$APP_ID" data)/tmp/hypertabular-smoke.log"
          # The app exits when Program.cs returns; its last line, pass or fail, ends the wait.
          for _ in $(seq 1 60); do
            grep -q -E "^(all ok|[0-9]+ failure\(s\))" "$log" 2>/dev/null && break
            sleep 2
          done
          cat "$log"
          grep -q "ok   native library $want" "$log"
          grep -q "^all ok" "$log"

      - name: C# — an iOS device app links the core in
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dotnet build "$SMOKE_PROJECT" -c Release -f net11.0-ios -r ios-arm64 -p:EnableCodeSigning=false
          app=$(find "$SMOKE_BIN/net11.0-ios/ios-arm64" -maxdepth 1 -name '*.app')
          nm -g "$app/HyperTabular.AppleSmokeTest" > device-symbols.txt
          for symbol in hypertabular_version hypertabular_delimited_fill hypertabular_workbook_open hypertabular_workbook_fill; do
            grep -q " T _$symbol\$" device-symbols.txt \
              || { echo "::error::the iOS device app does not define $symbol; the core was not linked in"; exit 1; }
          done
          echo "the iOS device app defines the core's exports"

  # Android, in an emulator, for the three bindings that reach it: C#, Go and Swift. Ported
  # from HyperCast's job of the same name.
  #
  # C#: HyperTabular.AndroidSmokeTest, which runs the Native AOT smoke test's SmokeTest.Run()
  # from an Activity, against the package as a MAUI app would take it — packed here from
  # build-native's Android libraries and static-libs archives, and restored from a local
  # folder, so that what is proven is the .nupkg's own layout (NuGet's runtimes/{rid}/native/
  # into the APK's lib/{abi}/, and build/net11.0/HyperTabular.targets handing a Native AOT
  # publish its archive), not a project reference's. HyperCast arrives from nuget.org as the
  # package's own dependency, as it does for every consumer.
  #
  # Four APKs: CoreCLR (.NET 11's Android runtime; Mono is no longer supported there) and
  # Native AOT, each for android-x64 and android-arm64. The x64 pair runs in an x86_64
  # emulator whose image uses 16 KB pages, as Android 15 devices may, so a library aligned
  # for 4 KB would fail to load there; nothing hosted runs arm64 Android, so the arm64 pair is
  # inspected instead, the same way test-apple-mobile treats an iOS device build. Each
  # CoreCLR APK must carry libhypertabular.so for its ABI and pass zipalign -P 16 (the check
  # Google Play applies), and each Native AOT APK must not carry it at all, because the core
  # is linked into the app; the x64 one then passing in the emulator is the proof that it was.
  #
  # Go and Swift: each binding's whole suite, both corpora's replay included, cross-compiled
  # for Android against this run's archives (the static-libs artifact lands them in
  # go/staticlib and the Swift bundle) and run on the same emulator through adb, by the two
  # scripts that also run it against a local one: android_build_suite.sh and
  # android_device_test.sh. Go's ExampleWorkbook is skipped there, as in the iOS simulator:
  # it opens ../corpus by its path, and the device has nothing above the pushed directory.
  # The aarch64 builds are linked, not run. Swift's SDK for Android needs Swift 6.3 or later.
  test-android:
    needs: build-native
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      SMOKE_PROJECT: csharp/HyperTabular.AndroidSmokeTest/HyperTabular.AndroidSmokeTest.csproj
      SMOKE_DIR: csharp/HyperTabular.AndroidSmokeTest
      APP_ID: io.github.skunkwerkx.hypertabular.androidsmoketest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: native-android-*
          path: artifacts

      # Over the checkout, laid out by repository path: the Android archives land in
      # csharp/HyperTabular/staticlibs/android-{rid}/, go/staticlib/android_{goarch}/ and the
      # Swift bundle.
      - uses: actions/download-artifact@v8
        with:
          name: static-libs
          path: .

      - name: Stage runtimes/android-{rid}/native/
        run: |
          set -euo pipefail
          for rid in android-arm64 android-x64; do
            mkdir -p "csharp/HyperTabular/runtimes/$rid/native"
            cp "artifacts/native-$rid/libhypertabular.so" "csharp/HyperTabular/runtimes/$rid/native/"
            [ -f "csharp/HyperTabular/staticlibs/$rid/libhypertabular.a" ] \
              || { echo "::error::static-libs has no csharp/HyperTabular/staticlibs/$rid/libhypertabular.a"; exit 1; }
          done

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"

      # The android workload's build tasks run on a JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the .NET android workload
        run: dotnet workload install android

      # The restore also reads the .NET 11 daily feed: the android workload this SDK resolves
      # (37.0.0-rc.1) was built against runtime 11.0.0-rc.1.26428.117, a build newer than the
      # RC1 on nuget.org, and a Native AOT publish restores that runtime's NativeAOT and
      # ILCompiler packs by exact version. Drop it once the workload and the SDK agree again
      # (by .NET 11 GA at the latest).
      - name: Pack HyperTabular into a local feed
        run: |
          set -euo pipefail
          version="0.0.0-android.${{ github.run_id }}"
          echo "HYPERTABULAR_VERSION=$version" >> "$GITHUB_ENV"
          echo "HYPERTABULAR_FEED=$RUNNER_TEMP/feed%3Bhttps://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet11/nuget/v3/index.json" >> "$GITHUB_ENV"
          dotnet pack csharp/HyperTabular/HyperTabular.csproj -c Release -o "$RUNNER_TEMP/feed" -p:Version="$version"
          unzip -l "$RUNNER_TEMP/feed/HyperTabular.$version.nupkg" | tee "$RUNNER_TEMP/nupkg.txt"
          for path in runtimes/android-arm64/native/libhypertabular.so runtimes/android-x64/native/libhypertabular.so \
                      staticlibs/android-arm64/libhypertabular.a staticlibs/android-x64/libhypertabular.a; do
            grep -q " $path\$" "$RUNNER_TEMP/nupkg.txt" || { echo "::error::the package has no $path"; exit 1; }
          done

      # Each build from a clean tree, since the CoreCLR and Native AOT builds of one RID share
      # bin/ and obj/; the signed APK is copied out under a name that says which it is.
      - name: Build the four APKs
        run: |
          set -euo pipefail
          mkdir -p apks
          for rid in android-x64 android-arm64; do
            for runtime in coreclr aot; do
              rm -rf "${SMOKE_DIR:?}/bin" "${SMOKE_DIR:?}/obj"
              aot=false
              [ "$runtime" = aot ] && aot=true
              dotnet publish "$SMOKE_PROJECT" -c Release -r "$rid" -p:PublishAot="$aot" \
                -p:HyperTabularVersion="$HYPERTABULAR_VERSION" -p:RestoreAdditionalProjectSources="$HYPERTABULAR_FEED"
              apk="$(find "$SMOKE_DIR/bin" -name "$APP_ID-Signed.apk" | head -1)"
              [ -n "$apk" ] || { echo "::error::no signed APK for $runtime $rid"; exit 1; }
              cp "$apk" "apks/$runtime-$rid.apk"
            done
          done
          ls -l apks

      - name: Inspect the APKs
        run: |
          set -euo pipefail
          zipalign="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name zipalign | sort -V | tail -1)"
          for rid in android-x64 android-arm64; do
            case "$rid" in android-x64) abi=x86_64 ;; android-arm64) abi=arm64-v8a ;; esac
            unzip -l "apks/coreclr-$rid.apk" | grep -q " lib/$abi/libhypertabular.so\$" \
              || { echo "::error::the CoreCLR $rid APK has no lib/$abi/libhypertabular.so"; exit 1; }
            "$zipalign" -c -P 16 -v 4 "apks/coreclr-$rid.apk" | grep "libhypertabular.so"
            for runtime in coreclr aot; do
              "$zipalign" -c -P 16 4 "apks/$runtime-$rid.apk" \
                || { echo "::error::the $runtime $rid APK fails zipalign -P 16"; exit 1; }
            done
            if unzip -l "apks/aot-$rid.apk" | grep -q "/libhypertabular.so\$"; then
              echo "::error::the Native AOT $rid APK carries libhypertabular.so; the core should be linked into the app"
              exit 1
            fi
            echo "$rid: the CoreCLR APK carries lib/$abi/libhypertabular.so; the Native AOT APK links the core in; both pass zipalign -P 16"
          done

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # After the APKs: setup-swift puts its toolchain's clang first on PATH.
      - uses: SwiftyLab/setup-swift@v1.14.1
        with:
          swift-version: "6.4"

      - name: Go and Swift — cross-build the suites for Android
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for arch in x86_64 aarch64; do
            .github/scripts/android_build_suite.sh go "$arch" "stage/go-$arch"
            .github/scripts/android_build_suite.sh swift "$arch" "stage/swift-$arch"
          done

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the x64 APKs and the Go and Swift suites in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis_ps16k
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # One command per line: the action runs each on its own and fails on the first that does.
          script: |
            .github/scripts/android_smoke.sh "$APP_ID" "$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)" apks/coreclr-android-x64.apk apks/aot-android-x64.apk
            .github/scripts/android_device_test.sh stage/go-x86_64 ./hypertabular.test -test.v -test.skip '^ExampleWorkbook$'
            .github/scripts/android_device_test.sh stage/swift-x86_64 ./HyperTabularPackageTests.xctest
