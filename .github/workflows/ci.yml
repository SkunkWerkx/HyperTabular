name: CI — build native, build wasm, test every binding
run-name: ${{ github.event_name == 'workflow_dispatch' && format('CI purpose={0}', inputs.purpose) || '' }}

# The board: the Rust core first, on the seven hosts (hyper-core.yml, one caller job whose
# matrix builds, tests, export-checks and C-smokes each leg and uploads native-<rid>), then
# one job per host × binding, each binding's own Forge workflow called only when `changes`
# says the pull request touched it (or the core, or .github/), so a one-binding change pays
# one toolchain setup per host and nothing for the eight other bindings. Each binding's lint
# runs once, on ubuntu-26.04-arm, ahead of its suites: a red lint starts no suite anywhere.
# On workflow_dispatch and schedule nothing is gated — `changes` emits every output true and
# docs_only false — so the release-mode board is the whole board, and pr-board, the one
# status to read, is red when any needed job failed or was skipped while its gate said run.
#
# A pull request asks whether the code broke: the core compiled, its suite run and its thesis
# proven (no_std, no allocator, no panic path), then the corpus
# through the bindings it can reach, each on one leg (linux-x64; Swift on xcode-27, PHP on ZTS).
# Each binding is one job: its toolchain once, then lint, then its suite. A core change lints Rust and
# runs every binding's suite, linting none of them but Go's regeneration proof, without which test-go
# would pass on a stale committed core. A binding change builds the core and lints and runs that
# binding, linting no Rust. Off a pull request nothing lints in those jobs: it already did to reach master. Everything else (the other platforms, musl,
# floors, static targets beyond Swift's one, wheels, wasm, Android, iOS, the packed-package jobs,
# the core's other source checks) runs on the board and a release, a cost paid by dispatching it.
#
# CI's job is build, test, and upload reusable artifacts. Every native leg builds+tests
# fresh, and the raw outputs (the plain FFI libhypertabular.so/.dylib/.dll, the compiled Ruby
# Magnus extension) get uploaded here for later reuse, as do the 17 PyPI wheels, which
# are built, installed and called into on every run (build-wheels below). On a release's run
# the tail below packs every registry input from those libraries too: the release train.
#
# None of it is version-agnostic: each native library reports the crate version it was
# built at (`hypertabular_version()`), and a wheel carries it in its file name. So the run a
# release publishes from has to be one that ran against the version-bump commit, which is
# why prepare-release.yml dispatches this workflow after it pushes the bump — see
# release.yml's tag-guard for the gate.
#
# The release tail, after the board and only on a master dispatch with purpose=release (what
# prepare-release.yml sends; purpose=board runs the board alone):
# `forge` resolves the one Forge commit this run uses, the eight pack jobs pack from this
# run's artifacts, `release-prepare` builds, attests and preserves the inventory (A, this
# run, the Forge), `codeql` dispatches codeql.yml on this commit and requires a clean
# dashboard, and `stage-release` commits B, the release commit, on master. The tag push at B
# then runs release.yml, which verifies and signs what this run preserved and publishes it.
#
# No push trigger, deliberately (not because master is branch-protected — checked via
# `gh api repos/.../branches/master/protection`, it isn't, despite this having been assumed
# here before): a stray run rebuilding/retesting on every trivial direct push (stage-release's
# own B included) would just be wasted compute for a result nobody's waiting on. The version
# bump is the one push that does need a run, and prepare-release.yml asks for it explicitly.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      # Required, with no default: a dispatch says what it is for. `release` (what
      # prepare-release.yml dispatches) runs the board and then the release tail; `board` runs
      # the board alone, whatever the ref.
      purpose:
        description: "board: the board alone; release: the board, then the release tail"
        required: true
        type: choice
        options:
          - board
          - release
  # The whole release-mode board once a week, so arm64, musl, iOS, the wheels and the second
  # Ruby ABI are exercised between releases instead of first on release day. Each Hyper* repo
  # takes its own day (HyperCast Monday, HyperTabular Tuesday, HyperUuid Wednesday), off the
  # hour: a board asks for about 100 runners, and three at once starve each other of them.
  schedule:
    - cron: "17 6 * * 2"  # Tuesday

# Least privilege for the whole board: every job below reads the repository and nothing more.
# The HyperForge jobs that attest, the pack jobs and release-prepare need id-token and
# attestations on top of that (SLSA provenance for what they build), codeql needs actions to
# start codeql.yml, and stage-release needs contents to push B; each declares those itself — a job-level `permissions:` replaces this block rather than
# adding to it, so the writes never reach another job. This is also what
# quietens CodeQL's actions/missing-workflow-permissions, which otherwise fires once per job.
permissions:
  contents: read

# A new push to a PR supersedes its running board; anything else runs to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the pull request touched, one boolean per class (.github/scripts/pr_changes.py has
  # the rules: `ci` is .github/**, `core` is rust/, include/, c/ and corpus/, `docs_only` is
  # Markdown and dotfiles alone, and an unclassified path is everything). Every gate below
  # reads these. The file list comes from the API, paginated, so a rename classifies both
  # sides and no checkout depth is involved; under pipefail an API failure is a red job, never
  # a docs-only board. Off a pull request every output is true: the whole board runs.
  changes:
    runs-on: ubuntu-26.04
    # pull-requests read is what the files endpoint documents for a fine-grained token (a public
    # repository's files are readable without it, but the scope is read-only either way and
    # a fork's pull request gets the same read token, so nothing is widened).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.classify.outputs.core }}
      ci: ${{ steps.classify.outputs.ci }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      lint_rust: ${{ steps.classify.outputs.lint_rust }}
      lint_csharp: ${{ steps.classify.outputs.lint_csharp }}
      lint_java: ${{ steps.classify.outputs.lint_java }}
      lint_python: ${{ steps.classify.outputs.lint_python }}
      lint_ruby: ${{ steps.classify.outputs.lint_ruby }}
      lint_php: ${{ steps.classify.outputs.lint_php }}
      lint_swift: ${{ steps.classify.outputs.lint_swift }}
      lint_typescript: ${{ steps.classify.outputs.lint_typescript }}
      lint_r: ${{ steps.classify.outputs.lint_r }}
      lint_go: ${{ steps.classify.outputs.lint_go }}
      csharp: ${{ steps.classify.outputs.csharp }}
      java: ${{ steps.classify.outputs.java }}
      python: ${{ steps.classify.outputs.python }}
      ruby: ${{ steps.classify.outputs.ruby }}
      php: ${{ steps.classify.outputs.php }}
      swift: ${{ steps.classify.outputs.swift }}
      typescript: ${{ steps.classify.outputs.typescript }}
      r: ${{ steps.classify.outputs.r }}
      go: ${{ steps.classify.outputs.go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify the pull request's files
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate \
              --jq '.[] | [.filename, (.previous_filename // "")] | @tsv' \
              | python3 .github/scripts/pr_changes.py | tee -a "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/pr_changes.py --all | tee -a "$GITHUB_OUTPUT"
          fi

  # HyperCast, the companion, from the run .github/hyper.json pins (the Forge's
  # hyper-companions.yml). In companion mode, every event but a purpose=release dispatch, it
  # mints a read-only token from the companion GitHub App, re-checks the pin and mirrors the
  # pinned run's artifacts into this run as companion-hypercast, which every leg's
  # fetch-companions takes with this run's own token. In release mode it mints nothing: it
  # refuses any companion override and requires the version the manifests name to be live on
  # every registry but CRAN. Never gated, since a skipped need fails GitHub's implicit
  # success() and would skip every job below whatever its own `if:` admits; every board job
  # needs it. The one job that sees the App's key.
  companions:
    uses: SkunkWerkx/.github/.github/workflows/hyper-companions.yml@master
    permissions:
      contents: read
    secrets:
      HYPER_COMPANION_APP_KEY: ${{ secrets.HYPER_COMPANION_APP_KEY }}

  # The core on the seven hosts: cargo cdylib, the crate's suite and corpus, the glibc floor,
  # the cdylib's exports held to rust/src/ffi.rs and loaded by .github/scripts/cdylib_smoke.py,
  # this leg's static archive, the C archive assembled from both and c/smoke/ built against
  # it, and native-<rid> uploaded (attested on a release dispatch). It never skips on a code
  # change: a binding change can touch nothing here and still needs a core to test against.
  core:
    needs: [changes, companions]
    if: needs.changes.outputs.docs_only != 'true'
    uses: SkunkWerkx/.github/.github/workflows/hyper-core.yml@master
    # A reusable workflow can never escalate beyond what the calling job was granted, so the
    # two scopes attest-build-provenance needs have to be handed down from here — id-token to
    # mint the OIDC token it signs with, attestations to record the result. contents stays
    # read: nothing in the called workflow writes to the repo.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      # rustfmt, clippy, actionlint and the C lint ahead of the build, on a pull request that moved
      # the core or .github/. What reached master has been linted.
      lint: ${{ github.event_name == 'pull_request' && needs.changes.outputs.lint_rust == 'true' }}
      extra_features: async
      crate: hypertabular
      project: HyperTabular

  # The cross-target bundle (Apple, Android, the archives the NuGet targets link), one
  # producer of static-libs: C#'s and Swift's suites and the NuGet consumer test download it. On a
  # pull request it builds the one archive Swift's leg links: `cargo cdylib` already compiled the
  # same no_std source, so only a target-specific break waits for a board.
  build-static:
    needs: [changes, companions]
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.swift == 'true'
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-static.yml@master
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      crate: hypertabular
      project: HyperTabular
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      apple_mobile: true
      android: true

  build-android:
    needs: [changes, companions]
    if: github.event_name != 'pull_request'
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-android.yml@master
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      crate: hypertabular
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}

  # The thesis, on every pull request that builds the core: no_std, no allocator and no panic path,
  # with the canary that shows the no-panic proof can reject. A binding relies on all three, so a
  # commit that breaks one must not reach master. Off a pull request core-checks runs them.
  core-proofs:
    needs: [changes, companions]
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true'
    uses: SkunkWerkx/.github/.github/workflows/hyper-core-proofs.yml@master
    permissions:
      contents: read
    with:
      core_script: rust/check-core.sh
      no_panic: false

  # Every static check on the core, in one Forge job on three hosts (hyper-core-checks.yml):
  # the C ABI held to rust/src/kernel/exports.rs by
  # .github/scripts/check_exports.py, the release checks, cargo-semver-checks against the last
  # crates.io release, the MSRV, the no_std consumer build, the crate's whole suite on
  # wasm32-wasip1 under a pinned wasmtime, and the
  # workflow-contract, ABI-probe and text-file tests in .github/scripts/tests. The inputs are what is
  # HyperTabular about it: rust/check-core.sh on both architectures proves the core has no
  # standard library, no allocation and no panic, running `cargo no-panic` and its canary
  # itself, so the Forge's own no-panic job is off; the async feature is built, tested,
  # linted and checked on the MSRV too; there is no conformance oracle to re-derive (the
  # corpus is generated, not derived); and `big_endian` runs the core's suite, both corpora
  # included, on s390x under QEMU.
  # The bindings' own lints run in their test-<binding> jobs below. None of it waits on the core legs.
  core-checks:
    needs: [changes, companions]
    if: github.event_name != 'pull_request'
    uses: SkunkWerkx/.github/.github/workflows/hyper-core-checks.yml@master
    permissions:
      contents: read
    with:
      core_script: rust/check-core.sh
      extra_features: async
      no_panic: false
      corpus_oracle: ""
      big_endian: s390x-unknown-linux-gnu

  # Each binding's job: on a pull request that touched it, its linters on one leg ahead of its
  # suite; off one no lint, since what reached master has been linted. Its suite runs on the hosts
  # it ships on, after the core legs (Go waits for nothing: its core is committed Go source). The inputs are the ones the native
  # workflow took for the binding; the jobs whose Forge workflow attests what it uploads
  # (jni-<rid>, node-<rid>, ruby-native-<rid>-<abi>, php-ext-<rid>-<minor>) hand down the two
  # scopes, as core does.
  test-csharp:
    needs: [changes, companions, core, build-static]
    if: ${{ !cancelled() && needs.companions.result == 'success' && needs.core.result == 'success' && (needs.build-static.result == 'success' || needs.build-static.result == 'skipped') && (needs.changes.outputs.csharp == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true') }}
    uses: SkunkWerkx/.github/.github/workflows/hyper-test-csharp.yml@master
    permissions:
      contents: read
    with:
      lint: ${{ github.event_name == 'pull_request' && needs.changes.outputs.lint_csharp == 'true' }}
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypertabular
      project: HyperTabular
      # Turns the package's Native AOT claim into a per-platform receipt: publish on all five
      # legs, fail on any ILxxxx/AOTxxxx trim diagnostic, then actually run the produced
      # binary and require exit 0. The log uploads as aot-report-{rid}. The smoke test
      # exercises a door from every family plus the union's compile-checked consumption, so
      # it covers the AOT-sensitive surface, not one call.
      csharp_aot_project: csharp/HyperTabular.AotSmokeTest/HyperTabular.AotSmokeTest.csproj
      csharp_aot_frameworks: "net10.0 net11.0"
      # The suite and the AOT smoke test run on net10.0 and net11.0 on every desktop and musl
      # leg: the forge installs the global.json SDK plus the 10.0 runtime and publishes once
      # per framework. iOS, Mac Catalyst and Android stay .NET 11 (HYPERTABULAR003); Blazor
      # WebAssembly takes both.
      csharp_test_project: csharp/HyperTabular.Tests/HyperTabular.Tests.csproj
      csharp_extra_runtime: "10.0"
      # The csproj's runtimes/**/native wildcard stages at pack time, so the binding takes the
      # pipeline's explicit per-leg placement for in-repo testing.
      csharp_runtimes_dir: csharp/HyperTabular/runtimes
  test-java:
    needs: [changes, companions, core]
    if: ${{ !cancelled() && needs.companions.result == 'success' && needs.core.result == 'success' && (needs.changes.outputs.java == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true') }}
    uses: SkunkWerkx/.github/.github/workflows/hyper-test-java.yml@master
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      lint: ${{ github.event_name == 'pull_request' && needs.changes.outputs.lint_java == 'true' }}
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypertabular
      project: HyperTabular
      # A jar has no per-platform package selection like NuGet's RID folders, so the binding
      # takes the pipeline's explicit per-leg placement for in-repo testing.
      java_resources_dir: java/src/main/resources/native
      # JDK 21 is the jar's floor (JNI on 21–24), shipped beside the primary 25; it reaches
      # EOL at Temurin on 2029-12-31, then this input and `java_jni` go.
      java_jni: true
      jdk_floor_version: "21"
  test-python:
    needs: [changes, companions, core]
    if: ${{ !cancelled() && needs.companions.result == 'success' && needs.core.result == 'success' && (needs.changes.outputs.python == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true') }}
    uses: SkunkWerkx/.github/.github/workflows/hyper-test-python.yml@master
    permissions:
      contents: read
    with:
      lint: ${{ github.event_name == 'pull_request' && needs.changes.outputs.lint_python == 'true' }}
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypertabular
      project: HyperTabular
  test-ruby:
    needs: [changes, companions, core]
    if: ${{ !cancelled() && needs.companions.result == 'success' && needs.core.result == 'success' && (needs.changes.outputs.ruby == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true') }}
    uses: SkunkWerkx/.github/.github/workflows/hyper-test-ruby.yml@master
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      lint: ${{ github.event_name == 'pull_request' && needs.changes.outputs.lint_ruby == 'true' }}
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypertabular
      project: HyperTabular
      pure_env: HYPERTABULAR_PURE
      # The forge's ruby_version default (4.0, the current release) is the primary ABI; this
      # adds a second Magnus build+suite against 3.4 so each platform gem can ship both. A
      # Magnus extension is bound to one Ruby minor — unlike PyO3's abi3 wheels, which is why
      # Python needs no equivalent input. Keep this in step with ruby/Rakefile's ABIS, the
      # Forge's ruby.abis default (RUBY_ABIS in hyper_config.py, which its pack-gems action
      # packs) and hyper-build-wasm.yml's ruby_wasm_abis default; `rake native:gem` aborts
      # naming the missing file if they drift. Ruby 3.4 goes EOL 2028-03-31 — clear this line
      # then and 3.4 consumers fall back to the universal Fiddle gem, which is exactly what
      # it's there for.
      ruby_compat_version: "3.4"
  test-php:
    needs: [changes, companions, core]
    if: ${{ !cancelled() && needs.companions.result == 'success' && needs.core.result == 'success' && (needs.changes.outputs.php == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true') }}
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-php-extension.yml@master
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      lint: ${{ github.event_name == 'pull_request' && needs.changes.outputs.lint_php == 'true' }}
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypertabular
      # The floor composer.json declares; explicit while the Forge's default is still 8.2,
      # below every Hyper* floor.
      # A pull request builds and tests the extension on linux-x64 alone, on the newest minor;
      # release mode builds every minor on six RIDs.
      php_floor_version: "8.3"
      # The suite judges every cell with ext-hypercast's classes, which the companions block
      # in .github/hyper.json names: the pinned run's extension in companion mode, built from
      # the registry release Cargo.lock pins in release mode, loaded beside this one.
  test-swift:
    needs: [changes, companions, core, build-static]
    if: ${{ !cancelled() && needs.companions.result == 'success' && needs.core.result == 'success' && needs.build-static.result == 'success' && (needs.changes.outputs.swift == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true') }}
    uses: SkunkWerkx/.github/.github/workflows/hyper-test-swift.yml@master
    permissions:
      contents: read
    with:
      lint: ${{ github.event_name == 'pull_request' && needs.changes.outputs.lint_swift == 'true' }}
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypertabular
      project: HyperTabular
  test-typescript:
    needs: [changes, companions, core]
    if: ${{ !cancelled() && needs.companions.result == 'success' && needs.core.result == 'success' && (needs.changes.outputs.typescript == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true') }}
    uses: SkunkWerkx/.github/.github/workflows/hyper-test-typescript.yml@master
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      lint: ${{ github.event_name == 'pull_request' && needs.changes.outputs.lint_typescript == 'true' }}
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypertabular
      project: HyperTabular
  test-r:
    needs: [changes, companions, core]
    if: ${{ !cancelled() && needs.companions.result == 'success' && needs.core.result == 'success' && (needs.changes.outputs.r == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true') }}
    uses: SkunkWerkx/.github/.github/workflows/hyper-test-r.yml@master
    permissions:
      contents: read
    with:
      lint: ${{ github.event_name == 'pull_request' && needs.changes.outputs.lint_r == 'true' }}
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypertabular
      project: HyperTabular
  test-go:
    needs: [changes, companions]
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true'
    uses: SkunkWerkx/.github/.github/workflows/hyper-test-go.yml@master
    permissions:
      contents: read
    with:
      # On a pull request gofmt, go vet and revive when go/ moved, the regeneration proof always:
      # test-go would pass on a stale committed core. Off one, no lint: the proof, the sweep and the race run.
      linters: ${{ github.event_name != 'pull_request' && 'sweep' || needs.changes.outputs.lint_go == 'true' && 'fast' || 'core' }}
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypertabular
      go_version_file: go/go.mod
  # The C archives the release attaches, packed from this run's libraries the way the tag run
  # packs them (c_package.py pack over every RID, the Android archives included, and the
  # layout check), uploaded as c-packages-ci. The per-RID smokes ran on the core legs and the
  # formatter in core-checks, so this is the pack alone; test-apple-mobile packs and smokes
  # its four Apple mobile archives itself, so it never waits on this job.
  pack-c:
    needs: [changes, companions, core, build-static, build-android]
    if: github.event_name != 'pull_request'
    uses: SkunkWerkx/.github/.github/workflows/hyper-test-c.yml@master
    permissions:
      contents: read
    with:
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      smokes: false
      lint: false

  # C#/NuGet's WASM support is a shipped surface (Norse Architecture needs it), so the
  # board and every release build it.
  build-wasm:
    needs: [changes, companions]
    if: github.event_name != 'pull_request'
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wasm.yml@master
    # Handed down for the same reason as core's: the ruby.wasm job attests the archives the
    # companion gem ships.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # pr: every leg and suite, nothing only a release needs (see the forge's README).
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypertabular
      project: HyperTabular
      # Every browser target runs in headless Chrome, not just built, each when the pull
      # request can reach it: the archive and the Blazor smoke app linking it (C#, the core
      # or the workflows), the crate itself for wasm32-unknown-unknown (the core), and the Go
      # binding's smoke package compiled by TinyGo, its core being Go source (translated by
      # wasm2go from the crate's wasm32-wasip1 build and committed). The Go suite itself runs
      # on WebAssembly too: under TinyGo on wasip1 (wasmtime, the corpus mounted, with a
      # negative control without the mount), and under stock Go on js/wasm (Node) and
      # wasip1/wasm (wasmtime). And in release mode (weekly and release, not PRs) the Magnus
      # extension, built for each Ruby minor the -wasm gem carries, linked into a ruby.wasm
      # interpreter and run under Node and in headless Chrome; those archives are uploaded as
      # ruby-wasm-{minor} for release.yml.
      archive: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.csharp == 'true' }}
      blazor_check: ${{ (needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.csharp == 'true') && 'csharp/HyperTabular.WasmSmokeTest/check.sh' || '' }}
      rust_browser_test: ${{ (needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true') && 'rust/browser-test' || '' }}
      go_wasm_suite: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true' }}
      go_tinygo_smoke: ${{ (needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.go == 'true') && 'go/internal/tinygosmoke' || '' }}
      ruby_wasm_smoke: ruby/wasm-smoke
      # The TypeScript binding's WebAssembly fallback: the napi-rs module built for threadless
      # wasm32-wasip1, the whole suite run against it with the native addon refused, the WASI
      # npm package packed as the release packs it and run bundled into a page in headless
      # Chrome; the module and its loaders are attested and uploaded as node-wasm32-wasip1,
      # which pack-npm and test-npm-package below consume. First job in that workflow: the
      # newest code fails first.
      node_wasi: ${{ needs.changes.outputs.core == 'true' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.typescript == 'true' }}

  # The 17 PyPI wheels, on every run rather than only at the tag: built by maturin,
  # installed on their own platform and on each interpreter they serve, free-threaded ones
  # included (the musl ones on Alpine, osx-x64 under Rosetta, the Pyodide one in Pyodide
  # under Node and in headless Chrome, where the whole pytest suite runs too), called
  # into, attested and uploaded as pypi-wheels-{rid}. release.yml publishes these exact
  # files. A wheel that cannot be installed therefore fails the board; while they
  # were built in release.yml, 0.4.0's osx-x64 wheel failed its first install with four
  # registries already published. With `sdist` in `.github/hyper.json`, the source
  # distribution too: built, `pip install`ed at exactly `rust-version` on manylinux2014 and
  # Alpine (one minor lower must fail), attested and uploaded as `pypi-wheels-sdist`.
  build-wheels:
    needs: [changes, companions]
    if: github.event_name != 'pull_request'
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wheels.yml@master
    # Same two scopes core hands down, for the same reason: the forge attests each wheel and
    # cannot escalate past what this job was granted.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # pr: the Pyodide wheel and its in-browser suite only; the native wheels are packaging.
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypertabular

  # iOS and Mac Catalyst, for the three bindings that reach them. Neither platform loads a
  # library: the core is linked into the app, from the static libraries build-static
  # cross-compiles and attests (the forge's apple_mobile input), which
  # are the bytes the release attaches for Swift (zipped) and release.yml packs for C#.
  # This job is the one place they are linked into something and run, and it needs what no
  # build-native leg carries: Xcode, a simulator, and the .NET ios and maccatalyst workloads.
  #
  #  * Swift takes them from swift/HyperTabularCoreApple.xcframework, which swift/Package.swift
  #    declares only when it is there. The binding's suite runs on an iOS simulator and as a
  #    Mac Catalyst process, and the package is built for an iOS device. It also runs once
  #    more for macOS itself, and the root manifest is built, both with this run's bundle and
  #    XCFramework in the tree: with the XCFramework present the manifest declares a second
  #    binary target and puts a platform condition on the first, which is the package a macOS
  #    consumer resolves from a tag (there from the release's zips).
  #  * C# takes them from csharp/HyperTabular/staticlibs/{rid}/ through build/net10.0/HyperTabular.targets.
  #    HyperTabular.AppleSmokeTest is the Native AOT smoke test's SmokeTest.Run() as an app: run as a
  #    Mac Catalyst process, installed and launched in the simulator, and built for an iOS
  #    device with signing off. No runner has a device, so that last one is proved as far as
  #    a link goes: the app's executable must define the core's symbols.
  #
  #  * C packs its four archives here from static-libs, the bytes pack-c packs (header, static library, CMake and pkg-config
  #    files): c/smoke/apple-mobile.sh builds the smoke consumer against each and runs the
  #    simulator and Catalyst ones, in the simulator booted below.
  #  * Go takes none: its core is Go source (go/internal/core), so the suite here proves the
  #    translated core on iOS, not a link. It runs in the simulator through Go's own
  #    wrapper, misc/ios/go_ios_exec.go, which is how the Go project tests its iOS port; the
  #    test that reads rust/Cargo.toml and ExampleWorkbook, which opens ../corpus by its path
  #    as the documentation shows it, are skipped there, since the wrapper carries the module
  #    into the simulator and nothing above it, and the corpus is staged as
  #    go/testdata/corpus (corpus_test.go looks there too) for the same reason. Go requires
  #    external linking on ios/arm64, so both the simulator run and the device build go
  #    through a C compiler (Go's clangwrap.sh, the iPhoneOS SDK's clang), with nothing of
  #    the core's for it to link. The device build is built and kept, not run: no runner has
  #    a device. Mac Catalyst is not a Go target.
  #
  # The simulator hands back neither an exit code nor a console to a launched app, so the C#
  # app also writes what it prints to a file in its container (SmokeLog.cs) and that file is
  # what is checked.
  test-apple-mobile:
    needs: [changes, companions, build-static]
    # Starts as soon as the static archives exist and holds nothing back: only forge and
    # pr-board wait on it. Release board only.
    if: github.event_name != 'pull_request'
    # The .NET 11 RC2 ios and maccatalyst workloads (27.0.x) are built against Xcode 27.0 and
    # refuse any other version; macos-latest (macOS 26) tops out at Xcode 26.6. The xcode-27
    # image tracks the Xcode 27 major, not a point release: it ships 27.1 as its default and
    # does not carry 27.0, so the three dotnet builds below pass
    # ValidateXcodeVersion=false (dotnet/macios, docs/building-apps/build-properties.md) and
    # the smoke tests themselves prove the 27.0 to 27.1 skip is harmless. Drop the property
    # once a .NET 11 workload accepts the image's Xcode.
    runs-on: xcode-27
    env:
      APP_ID: io.github.skunkwerkx.hypertabular.applesmoketest
      SMOKE_PROJECT: csharp/HyperTabular.AppleSmokeTest/HyperTabular.AppleSmokeTest.csproj
      SMOKE_BIN: csharp/HyperTabular.AppleSmokeTest/bin/Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Over the checkout: the artifact is laid out by repository path, so the XCFramework
      # lands whole under swift/ and the C# archives under csharp/HyperTabular/staticlibs/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-libs
          path: .

      - name: Check out the Forge at master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: master
          path: .hyperforge
          persist-credentials: false

      # The SDK global.json names, as the Forge's C# legs take it; before the fetch, whose C#
      # wiring packs the pinned HyperCast with it.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Before the fetch, whose Go wiring runs `go mod edit` and `go list` with it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # The pinned HyperCast (.github/hyper.json's companions block) for all four bindings that
      # take it here: its static-libs packed into the C# package the app restores, its C
      # archives for the smoke, its Swift bundle and XCFramework under the pin both manifests
      # are rewritten to take by path, and its Go module replaced by the pin's source (the
      # fetch proves that replace; the Go suites build nothing else of HyperCast's). Before the
      # step below, whose xcodebuild resolves the package graph. Without a block it does nothing.
      - name: Fetch the companions
        id: companions
        uses: ./.hyperforge/.github/actions/fetch-companions
        with:
          leg: ci.yml:test-apple-mobile

      - name: What is installed, and what was staged
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          (cd swift && xcodebuild -list)
          find swift/HyperTabularCoreApple.xcframework -type f | sort
          ls csharp/HyperTabular/staticlibs/{ios-arm64,iossimulator-arm64,maccatalyst-arm64,maccatalyst-x64}/libhypertabular.a

      - name: Boot an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.rsplit("iOS", 1)[-1])]
          for runtime in sorted((r for r in devices if "SimRuntime.iOS" in r), key=version, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("no available iPhone simulator on this image")')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # The C archives' four Apple mobile smokes, moved here from the Forge's hyper-test-c.yml
      # so the full board boots one simulator: its four archives, packed here and built
      # against through CMake (c/smoke/apple-mobile.sh: the iOS and simulator slices, Mac
      # Catalyst on both architectures, maccatalyst-x64 under Rosetta), in the simulator above.
      # c_package.py needs a newer Python than the system one.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          python-version: "3.x"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !cancelled() }}
        with:
          name: static-libs
          path: c-artifacts/static-libs

      - name: Pack the four Apple mobile archives
        if: ${{ !cancelled() }}
        run: python3 .hyperforge/.github/scripts/c_package.py pack --artifacts c-artifacts --out c-packages --only ios-arm64 --only iossimulator-arm64 --only maccatalyst-arm64 --only maccatalyst-x64

      - name: Unpack the four Apple mobile archives
        if: ${{ !cancelled() }}
        id: unpack
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -n 1)
          mkdir unpacked
          for rid in ios-arm64 iossimulator-arm64 maccatalyst-arm64 maccatalyst-x64; do
            archives=(c-packages/*-"$version-$rid".tar.gz)
            [ "${#archives[@]}" = 1 ] && [ -f "${archives[0]}" ] \
              || { echo "::error::expected one $rid archive at $version, found: ${archives[*]}"; exit 1; }
            tar -xzf "${archives[0]}" -C unpacked
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rosetta
        if: ${{ !cancelled() }}
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      # HYPERCAST_PACKAGES, which the smoke's c/smoke/hypercast.sh reads, names the pinned
      # archives, and the script reports them for each of the four platforms.
      - name: C — the smoke takes the pinned companion
        if: ${{ !cancelled() && steps.companions.outputs.active == 'true' }}
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: >-
          "$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py c --root . --installed --rid ios-arm64
          --rid iossimulator-arm64 --rid maccatalyst-arm64 --rid maccatalyst-x64

      - name: C — the four Apple mobile archives, built against and run
        if: ${{ !cancelled() }}
        env:
          VERSION: ${{ steps.unpack.outputs.version }}
        run: c/smoke/apple-mobile.sh unpacked "$VERSION"

      # As the Forge's test-swift proves its legs: each package graph takes the pin by path, and
      # a fresh verbose build links the archives extracted from its swift-release-assets.
      - name: Swift — the suite takes the pinned companion
        if: steps.companions.outputs.active == 'true'
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: '"$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py swift --root . --dir swift --installed'

      - name: Swift — the root manifest takes the pinned companion
        if: steps.companions.outputs.active == 'true'
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: '"$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py swift --root . --dir . --installed'

      - name: Swift — macOS, with the XCFramework declared
        run: |
          set -euo pipefail
          described=$(cd swift && swift package describe)
          grep -q "HyperTabularCoreApple" <<<"$described" \
            || { echo "::error::swift/Package.swift did not declare the XCFramework target"; exit 1; }
          (cd swift && swift test)
          swift build

      # Each xcodebuild's output is kept: an Apple mobile build processes HyperCast's
      # XCFramework, which no `swift build` reaches, so its log is the proof that the pin's was
      # the one processed and linked (companion_origin.py's --xcodebuild-log).
      - name: Swift — the suite on the iOS simulator
        id: swift_ios_simulator
        if: ${{ !cancelled() }}
        working-directory: swift
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild test -scheme HyperTabular -destination "platform=iOS Simulator,id=$UDID" 2>&1 | tee "$RUNNER_TEMP/xcodebuild-ios-simulator.log"

      # Only after its build passed: a failed one's partial log would add an origin error to
      # the real one.
      - name: Swift — the iOS simulator build took the pinned companion
        if: ${{ !cancelled() && steps.swift_ios_simulator.outcome == 'success' && steps.companions.outputs.active == 'true' }}
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: >-
          "$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py swift --root . --dir swift --installed
          --xcodebuild-log "$RUNNER_TEMP/xcodebuild-ios-simulator.log"

      - name: Swift — the suite as a Mac Catalyst process
        id: swift_mac_catalyst
        if: ${{ !cancelled() }}
        working-directory: swift
        run: |
          set -euo pipefail
          xcodebuild test -scheme HyperTabular -destination "platform=macOS,variant=Mac Catalyst" 2>&1 | tee "$RUNNER_TEMP/xcodebuild-mac-catalyst.log"

      # Only after its build passed: a failed one's partial log would add an origin error to
      # the real one.
      - name: Swift — the Mac Catalyst build took the pinned companion
        if: ${{ !cancelled() && steps.swift_mac_catalyst.outcome == 'success' && steps.companions.outputs.active == 'true' }}
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: >-
          "$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py swift --root . --dir swift --installed
          --xcodebuild-log "$RUNNER_TEMP/xcodebuild-mac-catalyst.log"

      - name: Swift — the package builds for an iOS device
        if: ${{ !cancelled() }}
        working-directory: swift
        run: xcodebuild build -scheme HyperTabular -destination "generic/platform=iOS"

      - name: Go — the suite in the iOS simulator
        if: ${{ !cancelled() }}
        working-directory: go
        run: |
          set -euo pipefail
          # `go test` hands a cross-built test binary to go_{GOOS}_{GOARCH}_exec when one is
          # on PATH; Go's wrapper installs it in the booted simulator and runs it there.
          # clangwrap.sh is Go's own too, and targets the simulator SDK. The wrapper predates
          # modules: it copies the package into the app by its path under GOROOT or GOPATH and
          # stops if it is under neither, so it alone runs with the workspace as its GOPATH
          # (go test keeps the real one, and its module cache).
          mkdir -p "$RUNNER_TEMP/go-ios/bin" testdata
          cp -R ../corpus testdata/corpus
          go build -o "$RUNNER_TEMP/go-ios/go_ios_exec" "$(go env GOROOT)/misc/ios/go_ios_exec.go"
          printf '#!/bin/sh\nGOPATH=%q exec %q "$@"\n' "$GITHUB_WORKSPACE" "$RUNNER_TEMP/go-ios/go_ios_exec" \
            > "$RUNNER_TEMP/go-ios/bin/go_ios_arm64_exec"
          chmod +x "$RUNNER_TEMP/go-ios/bin/go_ios_arm64_exec"
          export PATH="$RUNNER_TEMP/go-ios/bin:$PATH"
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 CC="$(go env GOROOT)/misc/ios/clangwrap.sh" \
            go test -skip '^(TestNativeVersionIsTheCratesVersion|ExampleWorkbook)$' -v . | tee "$RUNNER_TEMP/go-ios/test.log"
          grep -q '^ok' "$RUNNER_TEMP/go-ios/test.log"

      - name: Go — an iOS device build of the suite
        if: ${{ !cancelled() }}
        working-directory: go
        run: |
          set -euo pipefail
          # The device SDK's clang, because Go's ios/arm64 port links externally; the
          # binary is the proof, there is no device to run it on.
          mkdir -p "$RUNNER_TEMP/go-ios"
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 \
            CC="$(xcrun --sdk iphoneos --find clang) -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=12.0" \
            go test -c -o "$RUNNER_TEMP/go-ios/hypertabular-device.test" .
          [ -s "$RUNNER_TEMP/go-ios/hypertabular-device.test" ] \
            || { echo "::error::the iOS device build of the Go suite produced no binary"; exit 1; }
          echo "the Go suite builds for an iOS device"

      - name: Install the .NET iOS and Mac Catalyst workloads
        if: ${{ !cancelled() }}
        run: dotnet workload install ios maccatalyst

      # The app restored as the builds below restore it, then the global packages folder's
      # HyperCast proven to be the job's feed's, byte for byte, before the first build.
      - name: C# — the app restores the pinned companion
        if: ${{ !cancelled() && steps.companions.outputs.active == 'true' }}
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: |
          set -euo pipefail
          dotnet restore "$SMOKE_PROJECT" -p:ValidateXcodeVersion=false
          "$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py csharp --root . --installed

      - name: C# — a Mac Catalyst app, built and run
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          dotnet build "$SMOKE_PROJECT" -c Release -f net11.0-maccatalyst -r maccatalyst-arm64 -p:ValidateXcodeVersion=false
          app=$(find "$SMOKE_BIN/net11.0-maccatalyst/maccatalyst-arm64" -maxdepth 1 -name '*.app')
          log="$TMPDIR/hypertabular-smoke.log"
          rm -f "$log"
          "$app/Contents/MacOS/HyperTabular.AppleSmokeTest"
          cat "$log"
          grep -q "ok   native library $want" "$log"
          grep -q "^all ok" "$log"

      - name: C# — an iOS app, installed and launched in the simulator
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          udid="${{ steps.sim.outputs.udid }}"
          dotnet build "$SMOKE_PROJECT" -c Release -f net11.0-ios -r iossimulator-arm64 -p:ValidateXcodeVersion=false
          app=$(find "$SMOKE_BIN/net11.0-ios/iossimulator-arm64" -maxdepth 1 -name '*.app')
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" "$APP_ID"
          log="$(xcrun simctl get_app_container "$udid" "$APP_ID" data)/tmp/hypertabular-smoke.log"
          # The app exits when Program.cs returns; its last line, pass or fail, ends the wait.
          for _ in $(seq 1 60); do
            grep -q -E "^(all ok|[0-9]+ failure\(s\))" "$log" 2>/dev/null && break
            sleep 2
          done
          cat "$log"
          grep -q "ok   native library $want" "$log"
          grep -q "^all ok" "$log"

      - name: C# — an iOS device app links the core in
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dotnet build "$SMOKE_PROJECT" -c Release -f net11.0-ios -r ios-arm64 -p:EnableCodeSigning=false -p:ValidateXcodeVersion=false
          app=$(find "$SMOKE_BIN/net11.0-ios/ios-arm64" -maxdepth 1 -name '*.app')
          nm -g "$app/HyperTabular.AppleSmokeTest" > device-symbols.txt
          # The exports the binding calls: a trimmed device app keeps those alone, so a plain fill
          # the binding no longer calls (it calls the _with ones) isn't there to find.
          for symbol in hypertabular_version hypertabular_delimited_fill_with hypertabular_workbook_open hypertabular_workbook_fill_with; do
            grep -q " T _$symbol\$" device-symbols.txt \
              || { echo "::error::the iOS device app does not define $symbol; the core was not linked in"; exit 1; }
          done
          echo "the iOS device app defines the core's exports"

      # The net10.0 apps the targets file refuses; the three net11.0 builds above are the
      # control, since they import the same file and build. The probe builds an Exe because
      # the Apple SDK's Xcode check (_ValidateXcodeVersion) runs only for one: a class library
      # builds on any Xcode, so without OutputType=Exe the probe would pass with the gate gone,
      # while with it the gate must win over the Xcode error (proven both ways locally on
      # Xcode 27.1, where a gate-less net10.0-ios Exe fails "requires Xcode 26.0").
      - name: C# — net10.0-ios and net10.0-maccatalyst stop with HYPERTABULAR003
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          gate=csharp/HyperTabular.PlatformGateTest/HyperTabular.PlatformGateTest.csproj
          gate_dir=csharp/HyperTabular.PlatformGateTest
          for probe in "net10.0-ios|iOS" "net10.0-maccatalyst|Mac Catalyst"; do
            tfm="${probe%%|*}"
            platform="${probe#*|}"
            rm -rf "${gate_dir:?}/bin" "${gate_dir:?}/obj"
            if dotnet build "$gate" -p:GateFramework="$tfm" -p:OutputType=Exe -tl:off > "gate-$tfm.log" 2>&1; then
              echo "::error::$tfm built; the gate did not stop it"; cat "gate-$tfm.log"; exit 1
            fi
            grep -qF "error HYPERTABULAR003" "gate-$tfm.log" \
              || { echo "::error::$tfm failed, but not with HYPERTABULAR003"; cat "gate-$tfm.log"; exit 1; }
            grep -qF "$platform needs .NET 11 or later: target ${tfm/net10.0/net11.0}." "gate-$tfm.log" \
              || { echo "::error::$tfm: the HYPERTABULAR003 text does not name $platform"; cat "gate-$tfm.log"; exit 1; }
            echo "$tfm stops with HYPERTABULAR003"
          done

  # Android, in an emulator, for the three bindings that reach it: C#, Go and Swift.
  #
  # C#: HyperTabular.AndroidSmokeTest, which runs the Native AOT smoke test's SmokeTest.Run()
  # from an Activity, against the package as a MAUI app would take it — packed here from
  # build-android's shared libraries and build-static's static-libs archives, and
  # restored from a local folder, so that what is proven is the .nupkg's own layout (NuGet's
  # runtimes/{rid}/native/ into the APK's lib/{abi}/, and build/net10.0/HyperTabular.targets
  # handing a Native AOT publish its archive), not a project reference's.
  #
  # Four APKs: CoreCLR (.NET 11's Android runtime; Mono is not supported there) and
  # Native AOT, each for android-x64 and android-arm64. The x64 pair runs in an x86_64
  # emulator whose image uses 16 KB pages, as Android 15 devices may, so a library aligned
  # for 4 KB would fail to load there; nothing hosted runs arm64 Android, so the arm64 pair is
  # inspected instead, the same way test-apple-mobile treats an iOS device build. Each
  # CoreCLR APK must carry libhypertabular.so for its ABI and pass zipalign -P 16 (the check
  # Google Play applies), and each Native AOT APK must not carry it at all, because the core
  # is linked into the app; the x64 one then passing in the emulator is the proof that it was.
  #
  # Go and Swift: each binding's whole suite, corpus replay included, cross-compiled for
  # Android (Swift against this run's archives, which the static-libs artifact lands in the
  # Swift bundle; Go from its translated core, linked through the NDK's clang only because
  # Go itself requires external linking on android/amd64) and run on the same emulator
  # through adb, by the two scripts that also run it locally: android_build_suite.sh and
  # android_device_test.sh. The
  # aarch64 builds are linked, not run. Swift's SDK for Android needs Swift 6.3 or later.
  test-android:
    needs: [changes, companions, build-static, build-android]
    # Release board only: an emulator run is minutes a pull request's own suites already cover.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      SMOKE_PROJECT: csharp/HyperTabular.AndroidSmokeTest/HyperTabular.AndroidSmokeTest.csproj
      SMOKE_DIR: csharp/HyperTabular.AndroidSmokeTest
      APP_ID: io.github.skunkwerkx.hypertabular.androidsmoketest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-android-*
          path: artifacts

      # Over the checkout, laid out by repository path: the Android archives land in
      # csharp/HyperTabular/staticlibs/android-{rid}/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-libs
          path: .

      - name: Check out the Forge at master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: master
          path: .hyperforge
          persist-credentials: false

      - name: Stage runtimes/android-{rid}/native/
        run: |
          set -euo pipefail
          for rid in android-arm64 android-x64; do
            mkdir -p "csharp/HyperTabular/runtimes/$rid/native"
            cp "artifacts/native-$rid/libhypertabular.so" "csharp/HyperTabular/runtimes/$rid/native/"
            [ -f "csharp/HyperTabular/staticlibs/$rid/libhypertabular.a" ] \
              || { echo "::error::static-libs has no csharp/HyperTabular/staticlibs/$rid/libhypertabular.a"; exit 1; }
          done

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Before the fetch, whose Go wiring runs `go mod edit` and `go list` with it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      # The pinned HyperCast (.github/hyper.json's companions block), in two passes, since Swift
      # can't be on PATH until after the APKs. This one: the C# package, packed with its Android
      # libraries into the job's feed, which the HyperTabular package below then requires
      # exactly (after setup-dotnet, since the wiring packs with the SDK); and the Go module,
      # replaced by the pin's source, which the fetch proves (the Go suite builds nothing else of
      # HyperCast's). Swift's pass follows setup-swift. Without a block it does nothing.
      - name: Fetch the companions
        id: companions
        uses: ./.hyperforge/.github/actions/fetch-companions
        with:
          leg: ci.yml:test-android
          ecosystems: csharp go

      # The wiring's nuget.config maps HyperCast to the pin's feed and every other id to
      # nuget.org, and NuGet considers no source a mapping leaves out, so the local feed the
      # packed HyperTabular is restored from (RestoreAdditionalProjectSources) would go unread
      # (NU1101). Every later restore reads this copy of that config instead (MSBuild takes
      # RestoreConfigFile from the environment): the same sources and mapping, plus that feed
      # mapped to HyperTabular alone. The root nuget.config is left as the wiring wrote it,
      # which the origin proof requires.
      - name: The local HyperTabular feed beside the pin's
        if: steps.companions.outputs.active == 'true'
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feed"
          "$FETCH_PYTHON" - "$RUNNER_TEMP/feed" "$RUNNER_TEMP/nuget.config" <<'PY'
          import sys
          from xml.sax.saxutils import quoteattr
          feed, out = sys.argv[1:]
          text = open('nuget.config', encoding='utf-8').read()
          source, mapping = '    <add key="nuget.org" ', '    <packageSource key="nuget.org">'
          if text.count(source) != 1 or text.count(mapping) != 1:
              sys.exit("::error::nuget.config is not the one the companion wiring writes")
          text = text.replace(source, f'    <add key="hypertabular" value={quoteattr(feed)} />\n' + source)
          text = text.replace(mapping, '    <packageSource key="hypertabular">\n'
                              '      <package pattern="HyperTabular" />\n    </packageSource>\n' + mapping)
          open(out, 'w', encoding='utf-8').write(text)
          PY
          cat "$RUNNER_TEMP/nuget.config"
          echo "RestoreConfigFile=$RUNNER_TEMP/nuget.config" >> "$GITHUB_ENV"

      # The android workload's build tasks run on a JDK.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Install the .NET android workload
        run: dotnet workload install android

      - name: Pack HyperTabular into a local feed
        run: |
          set -euo pipefail
          version="0.0.0-android.${{ github.run_id }}"
          echo "HYPERTABULAR_VERSION=$version" >> "$GITHUB_ENV"
          echo "HYPERTABULAR_FEED=$RUNNER_TEMP/feed" >> "$GITHUB_ENV"
          dotnet pack csharp/HyperTabular/HyperTabular.csproj -c Release -o "$RUNNER_TEMP/feed" -p:Version="$version"
          unzip -l "$RUNNER_TEMP/feed/HyperTabular.$version.nupkg" | tee "$RUNNER_TEMP/nupkg.txt"
          for path in runtimes/android-arm64/native/libhypertabular.so runtimes/android-x64/native/libhypertabular.so \
                      staticlibs/android-arm64/libhypertabular.a staticlibs/android-x64/libhypertabular.a; do
            grep -q " $path\$" "$RUNNER_TEMP/nupkg.txt" || { echo "::error::the package has no $path"; exit 1; }
          done

      # The app restored as its publishes restore it, then the global packages folder's
      # HyperCast proven to be the job's feed's, byte for byte, before the first APK.
      - name: The smoke test restores the pinned companion
        if: steps.companions.outputs.active == 'true'
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: |
          set -euo pipefail
          dotnet restore "$SMOKE_PROJECT" -r android-x64 \
            -p:HyperTabularVersion="$HYPERTABULAR_VERSION" -p:RestoreAdditionalProjectSources="$HYPERTABULAR_FEED"
          "$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py csharp --root . --installed

      # Each build from a clean tree, since the CoreCLR and Native AOT builds of one RID share
      # bin/ and obj/; the signed APK is copied out under a name that says which it is.
      - name: Build the four APKs
        run: |
          set -euo pipefail
          mkdir -p apks
          for rid in android-x64 android-arm64; do
            for runtime in coreclr aot; do
              rm -rf "${SMOKE_DIR:?}/bin" "${SMOKE_DIR:?}/obj"
              aot=false
              [ "$runtime" = aot ] && aot=true
              dotnet publish "$SMOKE_PROJECT" -c Release -r "$rid" -p:PublishAot="$aot" \
                -p:HyperTabularVersion="$HYPERTABULAR_VERSION" -p:RestoreAdditionalProjectSources="$HYPERTABULAR_FEED"
              apk="$(find "$SMOKE_DIR/bin" -name "$APP_ID-Signed.apk" | head -1)"
              [ -n "$apk" ] || { echo "::error::no signed APK for $runtime $rid"; exit 1; }
              cp "$apk" "apks/$runtime-$rid.apk"
            done
          done
          ls -l apks

      # The same file reaches the four APKs above from the package, and they build on net11.0
      # (the control); on net10.0 it stops the build.
      - name: C# — net10.0-android stops with HYPERTABULAR003
        run: |
          set -euo pipefail
          gate_dir=csharp/HyperTabular.PlatformGateTest
          rm -rf "${gate_dir:?}/bin" "${gate_dir:?}/obj"
          if dotnet build csharp/HyperTabular.PlatformGateTest/HyperTabular.PlatformGateTest.csproj -p:GateFramework=net10.0-android -tl:off > gate-android.log 2>&1; then
            echo "::error::net10.0-android built; the gate did not stop it"; cat gate-android.log; exit 1
          fi
          grep -qF "error HYPERTABULAR003" gate-android.log \
            || { echo "::error::net10.0-android failed, but not with HYPERTABULAR003"; cat gate-android.log; exit 1; }
          grep -qF "Android needs .NET 11 or later: target net11.0-android." gate-android.log \
            || { echo "::error::the HYPERTABULAR003 text does not name Android and net11.0-android"; cat gate-android.log; exit 1; }
          echo "net10.0-android stops with HYPERTABULAR003"

      - name: Inspect the APKs
        run: |
          set -euo pipefail
          zipalign="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name zipalign | sort -V | tail -1)"
          for rid in android-x64 android-arm64; do
            case "$rid" in android-x64) abi=x86_64 ;; android-arm64) abi=arm64-v8a ;; esac
            unzip -l "apks/coreclr-$rid.apk" | grep " lib/$abi/libhypertabular.so\$" >/dev/null \
              || { echo "::error::the CoreCLR $rid APK has no lib/$abi/libhypertabular.so"; exit 1; }
            "$zipalign" -c -P 16 -v 4 "apks/coreclr-$rid.apk" | grep "libhypertabular.so"
            for runtime in coreclr aot; do
              "$zipalign" -c -P 16 4 "apks/$runtime-$rid.apk" \
                || { echo "::error::the $runtime $rid APK fails zipalign -P 16"; exit 1; }
            done
            if unzip -l "apks/aot-$rid.apk" | grep "/libhypertabular.so\$" >/dev/null; then
              echo "::error::the Native AOT $rid APK carries libhypertabular.so; the core should be linked into the app"
              exit 1
            fi
            echo "$rid: the CoreCLR APK carries lib/$abi/libhypertabular.so; the Native AOT APK links the core in; both pass zipalign -P 16"
          done

      # After the APKs: setup-swift puts its toolchain's clang first on PATH.
      - uses: SwiftyLab/setup-swift@d60245579ea3836a3f2fa65ebbe1e8891d577c76 # v1.14.2
        with:
          swift-version: "6.4"

      # The leg's second pass, now that Swift is on PATH (its proof asks SwiftPM for the package
      # graph): the pin's bundle, its *-unknown-linux-android variants included, under the pin
      # the suite's manifest is rewritten to take by path. The first pass's C# and Go wiring
      # stay (.companions/env keeps their lines; the pin's tree isn't cleaned).
      - name: Fetch the companions, Swift
        id: companions_swift
        uses: ./.hyperforge/.github/actions/fetch-companions
        with:
          leg: ci.yml:test-android
          ecosystems: swift

      # Right before the cross-build, with the native build system it builds with: a host build
      # of the suite links the archives extracted from the pin's swift-release-assets.
      - name: Swift — the suite takes the pinned companion
        if: steps.companions_swift.outputs.active == 'true'
        env:
          FETCH_PYTHON: ${{ steps.companions_swift.outputs.python }}
        run: '"$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py swift --root . --dir swift --installed --build-system native'

      - name: Go and Swift — cross-build the suites for Android
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for arch in x86_64 aarch64; do
            .github/scripts/android_build_suite.sh go "$arch" "stage/go-$arch"
            .github/scripts/android_build_suite.sh swift "$arch" "stage/swift-$arch"
          done

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the x64 APKs and the Go and Swift suites in an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis_ps16k
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # One command per line: the action runs each on its own and fails on the first that does.
          script: |
            .github/scripts/android_smoke.sh "$APP_ID" "$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)" apks/coreclr-android-x64.apk apks/aot-android-x64.apk
            .github/scripts/android_device_test.sh stage/go-x86_64 ./hypertabular.test -test.v -test.skip '^ExampleWorkbook$'
            .github/scripts/android_device_test.sh stage/swift-x86_64 ./HyperTabularPackageTests.xctest

  # The .NET 10 half of the C# package, on Linux: packed from this run's libraries and taken
  # back out of a local feed, so that what is proven is the .nupkg's own layout. Four things:
  #  * the layout (lib/net10.0 and lib/net11.0, the targets file under build/net10.0 only);
  #  * the Native AOT smoke test published and run from the package on net10.0 and net11.0,
  #    with the core linked in (no libhypertabular.so beside the executable, none NEEDED, and a
  #    libc.so NEEDED line as the positive control that the readelf dump lists dependencies);
  #  * its control: the same package with build/ and buildTransitive/ stripped publishes a
  #    libhypertabular.so beside the executable, so the check above can see a lost static link;
  #  * the floor (net9.0 does not restore) and the gate, which admits Blazor WebAssembly on
  #    net10.0 and net11.0: evaluated, and built only to show HYPERTABULAR002, because this job
  #    installs no wasm workload.
  # The runner image's SDK is not assumed to be the only one: the job logs which are there.
  test-nuget-package:
    needs: [changes, companions, core, build-static]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      SMOKE_PROJECT: csharp/HyperTabular.AotSmokeTest/HyperTabular.AotSmokeTest.csproj
      SMOKE_DIR: csharp/HyperTabular.AotSmokeTest
      GATE_PROJECT: csharp/HyperTabular.PlatformGateTest/HyperTabular.PlatformGateTest.csproj
      GATE_DIR: csharp/HyperTabular.PlatformGateTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-x64
          path: artifacts

      # Over the checkout, laid out by repository path: the archive lands in
      # csharp/HyperTabular/staticlibs/linux-x64/.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-libs
          path: .

      - name: Check out the Forge at master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: master
          path: .hyperforge
          persist-credentials: false

      - name: Stage runtimes/linux-x64/native/
        run: |
          set -euo pipefail
          mkdir -p csharp/HyperTabular/runtimes/linux-x64/native
          cp artifacts/libhypertabular.so csharp/HyperTabular/runtimes/linux-x64/native/
          [ -f csharp/HyperTabular/staticlibs/linux-x64/libhypertabular.a ] \
            || { echo "::error::static-libs has no csharp/HyperTabular/staticlibs/linux-x64/libhypertabular.a"; exit 1; }

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The pinned HyperCast (.github/hyper.json's companions block), packed with its linux-x64
      # libraries into the job's feed, which the HyperTabular package below then requires
      # exactly; after setup-dotnet, since the wiring packs with the SDK. Without a block it
      # does nothing.
      - name: Fetch the companions
        id: companions
        uses: ./.hyperforge/.github/actions/fetch-companions
        with:
          leg: ci.yml:test-nuget-package

      # The wiring's nuget.config maps HyperCast to the pin's feed and every other id to
      # nuget.org, and NuGet considers no source a mapping leaves out, so the local feed the
      # packed HyperTabular is restored from (RestoreAdditionalProjectSources) would go unread
      # (NU1101). Every later restore reads this copy of that config instead (MSBuild takes
      # RestoreConfigFile from the environment): the same sources and mapping, plus that feed
      # mapped to HyperTabular alone. The root nuget.config is left as the wiring wrote it,
      # which the origin proof requires.
      - name: The local HyperTabular feed beside the pin's
        if: steps.companions.outputs.active == 'true'
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feed"
          "$FETCH_PYTHON" - "$RUNNER_TEMP/feed" "$RUNNER_TEMP/nuget.config" <<'PY'
          import sys
          from xml.sax.saxutils import quoteattr
          feed, out = sys.argv[1:]
          text = open('nuget.config', encoding='utf-8').read()
          source, mapping = '    <add key="nuget.org" ', '    <packageSource key="nuget.org">'
          if text.count(source) != 1 or text.count(mapping) != 1:
              sys.exit("::error::nuget.config is not the one the companion wiring writes")
          text = text.replace(source, f'    <add key="hypertabular" value={quoteattr(feed)} />\n' + source)
          text = text.replace(mapping, '    <packageSource key="hypertabular">\n'
                              '      <package pattern="HyperTabular" />\n    </packageSource>\n' + mapping)
          open(out, 'w', encoding='utf-8').write(text)
          PY
          cat "$RUNNER_TEMP/nuget.config"
          echo "RestoreConfigFile=$RUNNER_TEMP/nuget.config" >> "$GITHUB_ENV"

      - name: Which SDKs are here
        run: |
          set -euo pipefail
          dotnet --version
          dotnet --list-sdks

      - name: Pack HyperTabular into a local feed and check its layout
        run: |
          set -euo pipefail
          version="0.0.0-pkg.${{ github.run_id }}"
          echo "HYPERTABULAR_VERSION=$version" >> "$GITHUB_ENV"
          echo "HYPERTABULAR_FEED=$RUNNER_TEMP/feed" >> "$GITHUB_ENV"
          echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget-packages" >> "$GITHUB_ENV"
          dotnet pack csharp/HyperTabular/HyperTabular.csproj -c Release -o "$RUNNER_TEMP/feed" -p:Version="$version"
          unzip -l "$RUNNER_TEMP/feed/HyperTabular.$version.nupkg" | tee "$RUNNER_TEMP/nupkg.txt"
          for path in lib/net10.0/HyperTabular.Managed.dll lib/net11.0/HyperTabular.Managed.dll \
                      build/net10.0/HyperTabular.targets buildTransitive/net10.0/HyperTabular.targets \
                      runtimes/linux-x64/native/libhypertabular.so staticlibs/linux-x64/libhypertabular.a; do
            grep -q " $path\$" "$RUNNER_TEMP/nupkg.txt" || { echo "::error::the package has no $path"; exit 1; }
          done
          if grep -q " build/net11.0/\| buildTransitive/net11.0/" "$RUNNER_TEMP/nupkg.txt"; then
            echo "::error::the package carries a build/net11.0 or buildTransitive/net11.0 folder; the targets file is under net10.0 only"
            exit 1
          fi

      # The smoke test restored from the package, as the publishes below restore it, then the
      # global packages folder's HyperCast proven to be the job's feed's, byte for byte.
      - name: The package restores the pinned companion
        if: steps.companions.outputs.active == 'true'
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: |
          set -euo pipefail
          dotnet restore "$SMOKE_PROJECT" -r linux-x64 \
            -p:HyperTabularVersion="$HYPERTABULAR_VERSION" -p:RestoreAdditionalProjectSources="$HYPERTABULAR_FEED"
          "$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py csharp --root . --installed

      # Package mode: the smoke test takes the .nupkg from the feed, so NuGet makes the
      # targets import. One TFM at a time (without -f a multi-targeted publish fails with
      # NETSDK1129), from a clean tree, since the two share bin/ and obj/.
      - name: Native AOT from the package, on net10.0 and net11.0
        run: |
          set -euo pipefail
          for tfm in net10.0 net11.0; do
            rm -rf "${SMOKE_DIR:?}/bin" "${SMOKE_DIR:?}/obj"
            dotnet publish "$SMOKE_PROJECT" -c Release -f "$tfm" -r linux-x64 -p:PublishAot=true \
              -p:HyperTabularVersion="$HYPERTABULAR_VERSION" -p:RestoreAdditionalProjectSources="$HYPERTABULAR_FEED" \
              -o "aot-out/$tfm"
            if [ -e "aot-out/$tfm/libhypertabular.so" ]; then
              echo "::error::$tfm: aot-out/$tfm carries libhypertabular.so; the core should be linked into the executable"
              exit 1
            fi
            # readelf writes to a file, so a missing or unreadable executable fails the step
            # (set -e) instead of reading as "nothing NEEDED"; the libc line is the positive
            # control that the dump really lists dynamic dependencies.
            readelf -d "aot-out/$tfm/HyperTabular.AotSmokeTest" > "aot-needed-$tfm.txt"
            grep -q 'NEEDED.*libc\.so' "aot-needed-$tfm.txt" \
              || { echo "::error::$tfm: readelf lists no NEEDED libc.so; the dump cannot be trusted"; cat "aot-needed-$tfm.txt"; exit 1; }
            if grep -q 'NEEDED.*libhypertabular\.so' "aot-needed-$tfm.txt"; then
              echo "::error::$tfm: the executable needs libhypertabular.so at run time"
              exit 1
            fi
            "aot-out/$tfm/HyperTabular.AotSmokeTest" | tee "aot-run-$tfm.log"
            grep -qx "all ok" "aot-run-$tfm.log"
            echo "$tfm: the core is linked in and the smoke test passes"
          done

      # The control for the step above: without build/ and buildTransitive/ nothing hands
      # the publish its archive, and it quietly falls back to the shared library beside the
      # executable. If it did not, the check above could not see a lost static link.
      - name: Control — a package without its targets falls back to the shared library
        run: |
          set -euo pipefail
          nobuild="$HYPERTABULAR_VERSION.nobuild"
          dotnet pack csharp/HyperTabular/HyperTabular.csproj -c Release -o "$HYPERTABULAR_FEED" -p:Version="$nobuild"
          zip -d "$HYPERTABULAR_FEED/HyperTabular.$nobuild.nupkg" 'build/*' 'buildTransitive/*'
          rm -rf "${SMOKE_DIR:?}/bin" "${SMOKE_DIR:?}/obj"
          dotnet publish "$SMOKE_PROJECT" -c Release -f net10.0 -r linux-x64 -p:PublishAot=true \
            -p:HyperTabularVersion="$nobuild" -p:RestoreAdditionalProjectSources="$HYPERTABULAR_FEED" \
            -o aot-out/nobuild
          [ -e aot-out/nobuild/libhypertabular.so ] \
            || { echo "::error::the check in the previous step cannot see a lost static link"; exit 1; }
          echo "without its targets the publish carries libhypertabular.so beside the executable"

      - name: The floor is .NET 10
        run: |
          set -euo pipefail
          rm -rf "${SMOKE_DIR:?}/bin" "${SMOKE_DIR:?}/obj"
          if dotnet restore "$SMOKE_PROJECT" -p:TargetFrameworks=net9.0 \
               -p:HyperTabularVersion="$HYPERTABULAR_VERSION" -p:RestoreAdditionalProjectSources="$HYPERTABULAR_FEED" > restore-net9.log 2>&1; then
            echo "::error::net9.0 restored the package; the floor is net10.0"; cat restore-net9.log; exit 1
          fi
          grep -qF "NU1202: Package HyperTabular " restore-net9.log \
            || { echo "::error::the net9.0 restore failed, but not with NU1202"; cat restore-net9.log; exit 1; }
          echo "net9.0 does not restore the package (NU1202)"

      # The wasm archive is built with -Zbuild-std (on stable, RUSTC_BOOTSTRAP=1) for a feature set both .NET 10's and .NET 11's
      # wasm toolchains accept, so the gate stands aside for Blazor on both. Evaluation shows the
      # gate's answer; the build is to show HYPERTABULAR002, since this job installs no wasm
      # workload. The Android evaluation is the control: the property is read, and does flag.
      - name: The gate admits Blazor WebAssembly on .NET 10 and 11
        run: |
          set -euo pipefail
          control="$(dotnet msbuild "$GATE_PROJECT" -getProperty:_HyperTabularNet10Unsupported -p:GateFramework=net10.0-android)"
          [ "$control" = Android ] || { echo "::error::the gate does not flag net10.0-android (got '$control'); the reads below prove nothing"; exit 1; }
          for f in net10.0 net11.0; do
            rm -rf "${GATE_DIR:?}/bin" "${GATE_DIR:?}/obj"
            flag="$(dotnet msbuild "$GATE_PROJECT" -getProperty:_HyperTabularNet10Unsupported -p:GateFramework="$f" -p:RuntimeIdentifier=browser-wasm)"
            [ -z "$flag" ] || { echo "::error::the gate flags $f + browser-wasm: $flag"; exit 1; }
            if dotnet build "$GATE_PROJECT" -p:GateFramework="$f" -p:RuntimeIdentifier=browser-wasm -p:WasmNativeWorkloadAvailable=false -tl:off > "gate-wasm-$f.log" 2>&1; then
              echo "::error::$f + browser-wasm built without the wasm workload"; cat "gate-wasm-$f.log"; exit 1
            fi
            grep -qF "error HYPERTABULAR002" "gate-wasm-$f.log" \
              || { echo "::error::$f + browser-wasm failed, but not with HYPERTABULAR002"; cat "gate-wasm-$f.log"; exit 1; }
            if grep -qF "HYPERTABULAR003" "gate-wasm-$f.log"; then
              echo "::error::$f + browser-wasm raised HYPERTABULAR003"; cat "gate-wasm-$f.log"; exit 1
            fi
            echo "$f + browser-wasm passes the gate (and stops at HYPERTABULAR002 without the workload)"
          done

  # The npm packages as a consumer gets them, on the three desktop OSes (a native pass on an OS
  # proves nothing about WASI initialisation and file resolution there; Windows' preopen and
  # path handling, macOS's resolution). Each leg first runs the whole conformance suite against
  # the WASI module built above, with the native addon refused (NAPI_RS_FORCE_WASI=error), so
  # byte-buffer mutation, batches, timestamps and error propagation are proven on the module
  # on that OS, not just that it loads; then packs the ten tarballs with the Forge's
  # npm_package.py, the release's own pack body, from the run's node-<rid> artifacts, and
  # serves them from a local Verdaccio to the installation scenarios in
  # typescript/consumer-tests/run.sh (its header lists them): a plain install loads native
  # with the WASI package present and an empty stderr; --omit=optional, a deleted native and
  # a forced run load wasm32-wasip1; three negative controls fail or report unavailability
  # the documented way; on Linux also npm/cli#4828's damaged lockfile, the exact Node floor
  # in node:22.14.0-alpine with engine-strict, an emulated s390x host (QEMU, so no native
  # package fits; big-endian, so the smoke's checks pass and the documented exit hang is
  # asserted, not hidden), two bundlers and, on every OS, a `bun add` whose result Node loads,
  # its lock agreeing with npm's. Bun runs the forced-WASI suite too, and its result is
  # recorded in the step summary without failing the job: Bun's node:wasi cannot initialise
  # the module today (the design spec's Bun decision); native Bun stays green on the TypeScript legs.
  # The Forge is checked out at master here, as release.yml does, for the pack script,
  # fetch-companions and companion_origin.py; the workflow calls above resolve the same way.
  test-npm-package:
    # node-<rid> comes from the TypeScript legs, node-wasm32-wasip1 from build-wasm.
    needs: [changes, companions, core, build-wasm, test-typescript]
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, xcode-27, windows-2025-vs2026]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the Forge at master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: master
          path: .hyperforge
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # The pinned HyperCast (.github/hyper.json's companions block): typescript/'s
      # devDependency rewritten to its packed tarball and the peer to its exact version, the
      # lock regenerated before the install below, and the whole set its release publishes packed
      # for the consumer tests' Verdaccio, named by HYPERCAST_TARBALLS (run.sh publishes it after
      # this package and its natives). Without a block it does nothing.
      - name: Fetch the companions
        id: companions
        uses: ./.hyperforge/.github/actions/fetch-companions
        with:
          leg: ci.yml:test-npm-package

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-*
          path: artifacts/node
          merge-multiple: false

      # The module and its loaders beside binding.js, where the loader's first WASI candidate
      # looks; no .node is built or downloaded into the checkout, and the forced mode never
      # consults one anyway. With a pin, the install is proven right after it, before the suite
      # (as the Forge's TypeScript legs do): the pinned HyperCast packages and nothing else.
      - name: The conformance suite against the WASI module, native refused
        shell: bash
        working-directory: typescript
        env:
          COMPANIONS_ACTIVE: ${{ steps.companions.outputs.active }}
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          if [ "$COMPANIONS_ACTIVE" = true ]; then
            "$FETCH_PYTHON" ../.hyperforge/.github/scripts/companion_origin.py npm --root .. --dir typescript --installed
          fi
          cp ../artifacts/node/node-wasm32-wasip1/* .
          ls -l hypertabular.wasm32-wasip1.wasm
          NAPI_RS_FORCE_WASI=error bun run test
          bun run typecheck

      # Bun's runner prints each failure as a `::error` workflow command when it sees GitHub
      # Actions, and Bun 1.4.4 cannot load the WASI module, so this tolerated step posted ten
      # error annotations per leg on the 1.1.0 preparation. Workflow commands are off for its
      # output and resumed before the exit status is returned, so the next step still records
      # the result and the Actions tab counts no errors from a step that cannot fail the job.
      - name: The same on Bun, recorded
        id: bun
        shell: bash
        working-directory: typescript
        continue-on-error: true
        run: |
          set -euo pipefail
          token="$(node -e 'console.log(require("node:crypto").randomBytes(16).toString("hex"))')"
          echo "::stop-commands::$token"
          status=0
          NAPI_RS_FORCE_WASI=error bun run test:bun || status=$?
          echo "::$token::"
          exit "$status"

      - name: Record Bun's result
        shell: bash
        env:
          BUN_OUTCOME: ${{ steps.bun.outcome }}
          OS: ${{ matrix.os }}
        run: |
          echo "- Bun $(bun --version) forced-WASI suite on $OS: $BUN_OUTCOME (recorded, never a failure of this job)" >> "$GITHUB_STEP_SUMMARY"

      # PR mode has no osx-x64 build (hyper-core.yml skips it), so the pack leaves that
      # platform package out by name, as pack-c does; the root still pins all eight, and npm
      # tolerates an optional dependency whose packument is missing. A release skips nothing.
      - name: Pack the ten tarballs as the release does
        shell: bash
        env:
          MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
        run: |
          set -euo pipefail
          case "$MODE" in
            release) skip=() ;;
            pr) skip=(--skip osx-x64) ;;
            *) echo "::error::mode must be release or pr, not $MODE"; exit 1 ;;
          esac
          python3 ".hyperforge/.github/scripts/npm_package.py" pack --package typescript --artifacts artifacts/node --out npm-packages ${skip[@]+"${skip[@]}"}
          ls -l npm-packages

      - name: The consumer-test harness
        shell: bash
        working-directory: typescript/consumer-tests
        run: bun install --frozen-lockfile

      # s390x for the emulated-host scenario; the floor and s390x scenarios need Docker, which
      # only this leg has, and the lockfile scenario runs beside them.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: matrix.os == 'ubuntu-26.04'
        with:
          platforms: s390x

      - name: Every installation scenario
        if: matrix.os == 'ubuntu-26.04'
        shell: bash
        run: bash typescript/consumer-tests/run.sh "$GITHUB_WORKSPACE/npm-packages" all

      - name: The installation scenarios this OS can run
        if: matrix.os != 'ubuntu-26.04'
        shell: bash
        run: >-
          bash typescript/consumer-tests/run.sh "$GITHUB_WORKSPACE/npm-packages"
          negative-unpublished plain omit-optional absent-native forced-wasi
          negative-deleted-package negative-deleted-wasm bundlers bun-install

      # Every scenario's lock, under the directories run.sh installed into (its `consumer`
      # names: omit-optional's is "consumer two"), resolves each HyperCast package with the
      # integrity of the pinned set the wiring packed. negative-unpublished's install fails and
      # leaves none; the container scenarios install inside their images.
      - name: Every scenario installed the pinned companion
        if: matrix.os == 'ubuntu-26.04' && steps.companions.outputs.active == 'true'
        shell: bash
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: >-
          "$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py npm --root .
          --installs typescript/consumer-tests/work --expect "plain,consumer two,absent-native,forced-wasi,negative-deleted-package,negative-deleted-wasm,bundlers,mac-lockfile,bun-install"

      - name: The scenarios this OS ran installed the pinned companion
        if: matrix.os != 'ubuntu-26.04' && steps.companions.outputs.active == 'true'
        shell: bash
        env:
          FETCH_PYTHON: ${{ steps.companions.outputs.python }}
        run: >-
          "$FETCH_PYTHON" .hyperforge/.github/scripts/companion_origin.py npm --root .
          --installs typescript/consumer-tests/work --expect "plain,consumer two,absent-native,forced-wasi,negative-deleted-package,negative-deleted-wasm,bundlers,bun-install"

  # The release tail. A release's run is dispatched by prepare-release.yml at master once the
  # bump is pushed as A; pull requests and the weekly schedule never reach it. Everything below
  # needs every board job above, through `forge`, so nothing is packed from a red board.
  #
  # The Forge is called at master. GitHub resolves that to one commit when the run is queued
  # and records it in the run's referenced_workflows; every .hyperforge checkout below and the
  # inventory's forge_sha use that commit, so the actions and scripts match the reusable
  # workflows. The tag run later requires this commit to be an ancestor of its own Forge.
  # The output is `revision`, not `sha`: CodeQL reads a checkout ref whose step, job or output
  # name contains head, sha, commit, branch or ref as a pull request head, and in a read-only
  # job it reports the checkout as a cache-poisoning step (actions/cache-poisoning/poisonable-step).
  forge:
    needs: [changes, companions, core, build-static, build-android, core-checks, test-csharp,
            test-java, test-python, test-ruby, test-php, test-swift, test-typescript, test-r,
            test-go, pack-c, build-wasm, build-wheels, test-nuget-package, test-npm-package,
            test-apple-mobile, test-android]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.purpose == 'release'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.forge.outputs.revision }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the Forge commit this run uses
        id: forge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shas=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --jq '[.referenced_workflows[] | select(.path | startswith("SkunkWerkx/.github/")) | .sha] | unique | .[]')
          [[ "$shas" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected one Forge commit in this run, got: ${shas:-none}"; exit 1; }
          echo "revision=$shas" >> "$GITHUB_OUTPUT"

      - name: Read the version this run was built at
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::rust/Cargo.toml has no stable X.Y.Z version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The eight pack jobs, each packing this run's attested artifacts at this commit and
  # attesting what it packs. The three reusable workflows carry the Forge's identity; the
  # composites keep this repository's, which RubyGems.org, npmjs.com and the inventory's
  # signer_repo for the gems, the npm tarballs, the CRAN tarball and the C archives require.
  nuget-org-pack:
    needs: [changes, forge]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.purpose == 'release'
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-nuget.yml@master
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      crate: hypertabular
      csproj_path: csharp/HyperTabular/HyperTabular.csproj
      runtimes_dir: csharp/HyperTabular/runtimes
      android: true
      source_run_id: ${{ github.run_id }}

  crate-pack:
    needs: [changes, forge]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.purpose == 'release'
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-crate.yml@master
    permissions:
      contents: read
      id-token: write
      attestations: write

  maven-pack:
    needs: [changes, forge]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.purpose == 'release'
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-maven.yml@master
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    with:
      crate: hypertabular
      java_resources_dir: java/src/main/resources/native
      java_jni: true
      source_run_id: ${{ github.run_id }}
    secrets:
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}

  ruby-pack:
    needs: [changes, forge]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.purpose == 'release'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.forge.outputs.revision }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/pack-gems
        with:
          run_id: ${{ github.run_id }}
          source_sha: ${{ github.sha }}
          token: ${{ github.token }}

  npm-pack:
    needs: [changes, forge]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.purpose == 'release'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.forge.outputs.revision }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/pack-npm
        with:
          run_id: ${{ github.run_id }}
          source_sha: ${{ github.sha }}
          token: ${{ github.token }}

  # The CRAN source tarball: preserved and inventoried with everything else, uploaded by no job.
  r-pack:
    needs: [changes, forge]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.purpose == 'release'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.forge.outputs.revision }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/pack-r
        with:
          source_sha: ${{ github.sha }}

  # The C archives, one per platform, for the GitHub Release: this run's attested libraries
  # with the header and c/'s package files.
  c-pack:
    needs: [changes, forge]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.purpose == 'release'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.forge.outputs.revision }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/pack-c
        with:
          run_id: ${{ github.run_id }}
          source_sha: ${{ github.sha }}
          token: ${{ github.token }}

  pypi-pack:
    needs: [changes, forge]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.purpose == 'release'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.forge.outputs.revision }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/verify-wheels
        with:
          run_id: ${{ github.run_id }}
          source_sha: ${{ github.sha }}
          token: ${{ github.token }}

  # One inventory of every registry input, every GitHub Release file and every shipped native,
  # each verified against its build provenance at this commit: inventory.json names A, this
  # run and the Forge above, and is attested here; release-packages is preserved for 90 days
  # in this run. The release attestation over every file is the tag's (release.yml).
  release-prepare:
    needs: [changes, forge, nuget-org-pack, crate-pack, maven-pack, ruby-pack, npm-pack, r-pack,
            c-pack, pypi-pack]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.purpose == 'release'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.forge.outputs.revision }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/release-prepare
        with:
          version: ${{ needs.forge.outputs.version }}
          source_sha: ${{ github.sha }}
          ci_run_id: ${{ github.run_id }}
          forge_sha: ${{ needs.forge.outputs.revision }}
          token: ${{ github.token }}
          npm_packages: true
          cran_packages: true

  # CodeQL on this commit, before B exists: codeql.yml is dispatched at master with this run's
  # id (its Swift leg unpacks this run's attested Swift zips, since no checkout carries a core),
  # held to have scanned this commit (master must still be A), watched to completion, and the
  # code scanning dashboard must then hold no open alert on master. The only job here that may
  # start a workflow; it checks nothing out.
  codeql:
    needs: [changes, forge]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.purpose == 'release'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write
      security-events: read
    steps:
      - name: Scan this commit and require a clean code scanning dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api --method POST -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/codeql.yml/dispatches" \
            -f ref=master --jq '.workflow_run_id')
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || { echo "::error::codeql.yml dispatch returned no run id"; exit 1; }
          scanned=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)
          [ "$scanned" = "$GITHUB_SHA" ] || { echo "::error::codeql.yml scanned $scanned, not this commit: master moved beyond A; prepare again"; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 60
          open=$(gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?state=open&ref=refs/heads/master&per_page=100" --jq '.[].number' | wc -l | tr -d ' ')
          [ "$open" = 0 ] || { echo "::error::$open open code scanning alerts on master; fix them and prepare again"; exit 1; }

  # B, the release commit: this run's attested Swift zips' checksums and the version written
  # into the root Package.swift and committed on master, which must still be A, with the
  # Release-Source-SHA, Release-CI-Run-ID and Release-Forge-SHA trailers release.yml's
  # tag-guard reads back. The only job here that may write the repository. The tag is pushed
  # at B by hand (RELEASING.md).
  stage-release:
    needs: [changes, forge, release-prepare, codeql]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.purpose == 'release'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      attestations: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkunkWerkx/.github
          ref: ${{ needs.forge.outputs.revision }}
          path: .hyperforge
          persist-credentials: false
      - uses: ./.hyperforge/.github/actions/stage-release
        with:
          source_sha: ${{ github.sha }}
          ci_run_id: ${{ github.run_id }}
          forge_sha: ${{ needs.forge.outputs.revision }}
          token: ${{ github.token }}

  # The one status to read. Master is not branch-protected and a skipped job satisfies a
  # required check, so this job, which always runs, is red when any job above failed or was
  # cancelled, or was skipped while `changes` said it should run (a too-narrow classifier
  # would otherwise be invisible); .github/scripts/pr_board.py has the gates, one per job.
  pr-board:
    needs: [changes, companions, core, build-static, build-android, core-checks, core-proofs,
            test-csharp, test-java, test-python, test-ruby, test-php, test-swift,
            test-typescript, test-r, test-go, pack-c, build-wasm, build-wheels, test-nuget-package,
            test-npm-package, test-apple-mobile, test-android, forge, nuget-org-pack, crate-pack,
            maven-pack, ruby-pack, npm-pack, r-pack, c-pack, pypi-pack, release-prepare, codeql,
            stage-release]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every needed job green, or skipped with its gate off
        env:
          NEEDS: ${{ toJSON(needs) }}
          CHANGES: ${{ toJSON(needs.changes.outputs) }}
          PURPOSE: ${{ inputs.purpose }}
        run: python3 .github/scripts/pr_board.py
