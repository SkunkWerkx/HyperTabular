# The build aliases the forge and every dev loop run (SkunkWerkx/.github, "The recipe").

# A Ruby or Python extension must not link the host runtime on Darwin.
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

# Every musl target defaults to a static C runtime, under which rustc cannot emit a cdylib.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]
[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

# The Blazor static library is built without std, so it cannot unwind: rustc refuses the
# build unless panics abort on this target. The CPU and features are the archive's whole wasm
# feature set, and every object in it is compiled with them, because `cargo wasm-staticlib`
# rebuilds core and compiler_builtins rather than taking Rust's prebuilt sysroot. That sysroot
# carries the legacy exception-handling encoding, which a browser refuses beside .NET 11's new
# one, and declares bulk-memory-opt and call-indirect-overlong, which .NET 10's wasm-opt does
# not know (dotnet/runtime#132858). And a .NET 10 Release publish runs the SDK's own wasm-opt
# after Emscripten's, enabling nothing past Binaryen's defaults (sign-ext, mutable-globals)
# but simd, bulk memory and exception handling, so an instruction from any other feature (a
# saturating float-to-int conversion, say) fails it. `mvp` plus those two, Binaryen's
# defaults, is a set every run in both runtimes accepts with no flag, and all the archive
# needs. This section applies only to cargo runs from rust/; the Pyodide wheel builds from
# python/.
[target.wasm32-unknown-emscripten]
rustflags = [
  "-C", "panic=abort",
  "-C", "target-cpu=mvp",
  "-C", "target-feature=+sign-ext,+mutable-globals",
]

[alias]
# The shared library every binding loads: the core alone, without Rust's standard library.
cdylib = ["rustc", "--release", "--lib", "--crate-type", "cdylib", "--no-default-features", "--features", "cdylib", "--config", 'profile.release.panic="abort"']
# The Zend extension (the `php` feature), in its own target directory: it is a differently
# shaped libhypertabular.so at the same path as the one every binding loads from
# target/release/, so building it there would replace that one. Output: target/php/release/.
php-ext = "rustc --release --lib --crate-type cdylib --features php --target-dir target/php"
# The Ruby Magnus extension (the `ruby` feature), in its own target directory for the same
# reason. `rake native:dev` (ruby/Rakefile) builds it and stages it where the gem looks.
# Output: target/ruby/release/.
ruby-ext = "rustc --release --lib --crate-type cdylib --features ruby --target-dir target/ruby"
# The static library the NuGet package links into a Blazor WebAssembly app, without std, so
# that it links beside another Hyper* library's. `-Zbuild-std` compiles core and
# compiler_builtins with the target section's flags above. It is a nightly flag, which stable
# cargo takes only with RUSTC_BOOTSTRAP=1 set for that one command, and it needs rust-src:
# `RUSTC_BOOTSTRAP=1 cargo wasm-staticlib`. Without the variable it stops at cargo's
# nightly-only error. The flag carries no stability promise, so CI's archive guard and Blazor
# legs are what prove each new stable release still builds it. Cargo caches rustc's target
# cfg in target/.rustc_info.json without regard to the variable, so after any plain cargo
# command for this target the build quietly loses the unstable cfgs (compiler_builtins drops
# its f16 and f128 intrinsics), and keeps what its build script made of them. CI's build is
# the first cargo command in a fresh checkout; locally, delete that file and
# target/wasm32-unknown-emscripten/ before building. Output:
# target/wasm32-unknown-emscripten/release/libhypertabular.a.
wasm-staticlib = "rustc -Zbuild-std=core,compiler_builtins --release --lib --target wasm32-unknown-emscripten --crate-type staticlib --no-default-features --features staticlib"
# The same no_std static library for any other target: `cargo staticlib --target <triple>`.
# Consumers that link one rather than load the shared library (Swift on Linux and
# WebAssembly, a C# Native AOT publish, a C program) take it, and the forge's
# static-libs/build-static-libs.sh runs this for each target. Built on the `staticlib` profile (Cargo.toml), which is release plus panics that
# abort.
staticlib = "rustc --profile staticlib --lib --crate-type staticlib --no-default-features --features staticlib"
# The proof that no export can panic. With std and unwinding, or it would prove nothing.
no-panic = "rustc --release --lib --crate-type cdylib --features no-panic --target-dir target/no-panic -- -C link-arg=-Wl,--no-undefined"
