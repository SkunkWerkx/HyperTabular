name: CI — prove the core, test the crate

# The core's three properties — no standard library, no allocation, no panic — proven on
# the library itself by rust/check-core.sh, and the whole crate's suite, on both
# architectures the engines are written for. This is the floor, not the pipeline: the
# forge's build-native matrix (SkunkWerkx/.github) joins it with the first binding.
#
# No `push` trigger, as in every Hyper* repo: a PR run and a manual one are enough.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      # The other architecture's library is only type-checked, which needs its target
      # and nothing else: nothing is linked for it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools
          targets: thumbv7em-none-eabi, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: The core is no_std, allocation-free and panic-free
        run: ./check-core.sh

      - name: cargo test
        run: cargo test

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --no-default-features --features cdylib -- -D warnings

  # The C# binding against this commit's core: its suite over the shared library (the
  # corpus replay among it), then the Native AOT smoke program with the core linked in from
  # the static archive the forge's own action builds. Until the other bindings exist this
  # stands in for the C# leg of the forge's build-native matrix, on Linux only.
  csharp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-26.04-arm
            rid: linux-arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"

      - name: Build the native core
        working-directory: rust
        run: cargo cdylib

      - name: Test the C# binding against it
        run: dotnet test --project csharp/HyperTabular.Tests/HyperTabular.Tests.csproj -c Release

      - name: Build this leg's static library
        uses: SkunkWerkx/.github/.github/actions/static-libs@master
        with:
          crate: hypertabular
          project: HyperTabular
          targets: ${{ matrix.target }}

      - name: Native AOT publish, the core linked in
        run: |
          dotnet publish csharp/HyperTabular.AotSmokeTest/HyperTabular.AotSmokeTest.csproj \
            -c Release -r ${{ matrix.rid }} -o "$RUNNER_TEMP/aot" -warnaserror
          # Linked in means nothing to load: no shared library beside the executable.
          if ls "$RUNNER_TEMP/aot" | grep -q 'libhypertabular'; then
            echo "::error::the AOT publish still carries the shared library"; exit 1
          fi

      - name: Run the AOT-published binary (must exit 0)
        run: '"$RUNNER_TEMP/aot/HyperTabular.AotSmokeTest"'

