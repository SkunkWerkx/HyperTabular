name: Prepare release

# HyperCast's, with this repo's names: bumps the version everywhere it has to live as
# committed text — Rust, C#, Java, and Ruby (both its gemspec and the lib/hypertabular.rb
# VERSION constant, together, so they can never drift apart) — and regenerates rust/Cargo.lock's own self-referential entry to match
# (cargo publish --locked fails on a stale one). Python needs nothing here: pyproject.toml
# declares its version dynamic, sourced straight from rust/Cargo.toml by maturin.
#
# PHP, Swift, and Go have no version field of their own (Packagist/SwiftPM/Go modules all
# resolve straight from the git tag), but they are not untouched by a bump: the native
# libraries committed for them embed the crate version (`hypertabular_version()`), so they have to
# be rebuilt from the bump commit and restaged before a tag can be cut.
#
# That is why this workflow ends by dispatching ci.yml against the commit it just pushed.
# It used to stop at the push, on the reasoning that a version-string change needs no
# rebuild — true until the library started reporting its own version, and the cause of
# HyperCast 0.3.0 shipping libraries that say 0.2.0. The order of a release is now:
#
#   1. this workflow: bump every manifest, push, dispatch ci.yml on the bump commit;
#   2. ci.yml goes green, and its completion triggers stage-native-binaries.yml, which
#      commits that run's libraries on top of the bump;
#   3. a human tags that staging commit, and release.yml refuses any tag whose ci.yml run
#      or committed libraries were built at a different version.
#
# Still a direct push straight to master, not a PR: the diff is mechanical, not something
# a review meaningfully improves. This workflow does not tag anything — that stays a
# deliberate, separate, human action once master's state looks right.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version, e.g. "0.1.0" (no leading "v" — that belongs on the git tag, not in any manifest)'
        required: true
        type: string

jobs:
  prepare-release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      # gh workflow run: the bump commit needs a ci.yml run of its own (see the header).
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate the version string
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == v* ]]; then
            echo "::error::Pass the bare version (e.g. 0.1.0), not a tag name — got '$VERSION'." >&2
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' doesn't look like a plain X.Y.Z semver version." >&2
            exit 1
          fi

      - name: Bump every committed manifest to $VERSION
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" rust/Cargo.toml
          sed -i "s/<Version>.*<\/Version>/<Version>$VERSION<\/Version>/" csharp/HyperTabular/HyperTabular.csproj
          sed -i "s/^version = System.getenv(\"HYPERTABULAR_VERSION\") ?: \".*\"/version = System.getenv(\"HYPERTABULAR_VERSION\") ?: \"$VERSION\"/" java/build.gradle.kts
          sed -i "s/spec\.version = \".*\"/spec.version = \"$VERSION\"/" ruby/hypertabular.gemspec
          sed -i "s/VERSION = \".*\"/VERSION = \"$VERSION\"/" ruby/lib/hypertabular.rb

          # Regenerates Cargo.lock's own self-referential package entry to match the bump
          # above — cargo publish --locked (pack-crates in release.yml) fails on a mismatch.
          cargo check --manifest-path rust/Cargo.toml
          # Companion crates that path-depend on the core carry their own lockfiles, which
          # nothing else regenerates (HyperCast's fuzz lockfile sat at 0.1.0 through three
          # releases). Each is updated only if this repo has it.
          for companion in rust/fuzz rust/browser-test; do
            if [ -f "$companion/Cargo.lock" ]; then
              cargo update --manifest-path "$companion/Cargo.toml" --package hypertabular
            fi
          done

      - name: Show what changed
        run: git diff --stat

      - name: Commit and push if anything actually changed
        id: push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/Cargo.toml rust/Cargo.lock csharp/HyperTabular/HyperTabular.csproj \
            java/build.gradle.kts ruby/hypertabular.gemspec ruby/lib/hypertabular.rb
          for lock in rust/fuzz/Cargo.lock rust/browser-test/Cargo.lock; do
            if [ -f "$lock" ]; then git add "$lock"; fi
          done
          if git diff --cached --quiet; then
            echo "::notice::Every manifest already says $VERSION — nothing to commit."
            exit 0
          fi
          git commit -m "chore: prepare v$VERSION"
          git push origin HEAD:master
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # workflow_dispatch is one of the two events a GITHUB_TOKEN is allowed to raise, so
      # this needs no PAT. ci.yml has no push trigger on purpose; this is the one push that
      # must be built, because it is the first commit whose native libraries will report
      # the new version. stage-native-binaries.yml picks the run up when it completes.
      - name: Run ci.yml against the bump commit
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "::notice::ci.yml dispatched on master. When it is green, stage-native-binaries.yml commits its libraries; tag THAT commit."
