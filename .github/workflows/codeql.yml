name: CodeQL

# Advanced setup rather than GitHub's default setup, for two reasons: default setup has no path
# filters, and test code is out of scope for the security queries (the excluding is done by
# .github/codeql/codeql-config.yml, which explains why); and its Swift autobuild builds the wrong
# package (see the matrix). Default setup must stay disabled in the repository settings: while it
# is on, GitHub rejects every upload from this workflow.
#
# Everything else mirrors what default setup ran — the same nine languages and the same default
# query suite — and `category` is spelled out below so alerts keep the
# `/language:<lang>` identity they had under default setup instead of being re-raised from
# scratch as new ones.
#
# The cost of the switch is that this file now owns what default setup owned: a language added
# to the repository is unscanned until it is added to the matrix.

# On demand, never on a schedule, a pull request or a push: the scan is a release gate, run on A by
# the preparation run's `codeql` job (ci.yml's tail), which dispatches it and
# requires a clean dashboard before B is staged (.github/RELEASING.md). Swift alone is why: under CodeQL's
# tracer a Swift build of this library costs minutes however it is invoked (`swift build
# --target` took 8m19s here; in HyperUuid, `swiftc` on the sources directly was slower still;
# untraced, either takes seconds), a fixed cost of the extractor rather than of the code, and
# not one worth paying on every pull request.
on:
  workflow_dispatch:

# A run for a ref waits for the one before it rather than cancelling it: a run to completion is
# what keeps the code scanning dashboard current.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      # What the CodeQL job needs and nothing more: SARIF upload, the workflow's own metadata, and
      # the default read-only access to the repository.
      security-events: write
      actions: read
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # No build to trace.
          - language: actions
            build-mode: none
            runner: ubuntu-latest
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-latest
          - language: python
            build-mode: none
            runner: ubuntu-latest
          - language: ruby
            build-mode: none
            runner: ubuntu-latest
          # Compiled, with a database built without a build. There is no Kotlin in this
          # repository, so `none` is valid for java-kotlin; the Rust and C# extractors are built
          # for it.
          - language: csharp
            build-mode: none
            runner: ubuntu-latest
          - language: java-kotlin
            build-mode: none
            runner: ubuntu-latest
          - language: rust
            build-mode: none
            runner: ubuntu-latest
          # Go and Swift have no no-build mode. Go's autobuild finds go/go.mod and is right.
          - language: go
            build-mode: autobuild
            runner: ubuntu-latest
          # Swift's autobuild picks swift/Benchmarks and spends 10-15 minutes on the benchmark
          # package's dependency tree, reaching the library only through it. The build step
          # below compiles the library alone. macos-latest, not the build legs' xcode-27: on
          # that image (macOS 27, Xcode 27.1) CodeQL 2.27.3's tracer broke SwiftPM's manifest
          # compile with "posix_spawn error: Bad CPU type in executable" (2026-11-01).
          - language: swift
            build-mode: manual
            runner: macos-latest
          # Not scanned: C/C++, whose only files are hypertabular.h in the CI-built Swift bundles
          # (nothing to compile; the C ABI is Rust's, rust/src/ffi.rs), and PHP, which CodeQL
          # does not support.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No checkout carries a Swift core, and the root Package.swift links a local one when swift/
      # has it. So this leg builds the commit it scans with the repo's own script, ahead of init so
      # the tracer never sees cargo. Taking a CI run's zips cost as long and added a way to fail.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.build-mode == 'manual'
        with:
          repository: SkunkWerkx/.github
          ref: master
          path: .hyperforge
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: matrix.build-mode == 'manual'
      # The manifests require what the code needs, HyperCast's next version, so this takes the commit
      # .github/hyper.json pins, as the board does: a scan never waits on a registry. From source:
      # this run has no mirror to verify, and the scan reads this repository's Swift alone.
      - name: The HyperCast commit hyper.json pins
        id: pin
        if: matrix.build-mode == 'manual'
        run: |
          set -euo pipefail
          commit=$(python3 -c "import json; print(json.load(open('.github/hyper.json'))['companions']['hypercast']['commit'])")
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.build-mode == 'manual'
        with:
          repository: SkunkWerkx/HyperCast
          ref: ${{ steps.pin.outputs.commit }}
          path: .companions/hypercast
          persist-credentials: false
      - name: Take HyperCast from the pin
        if: matrix.build-mode == 'manual'
        env:
          FORGE: ${{ github.workspace }}/.hyperforge
          FORGE_SCRIPTS: .hyperforge/.github/scripts
        run: |
          set -euo pipefail
          # The pin's own core first, for its root package to link, before the patch reaches Cargo.
          .companions/hypercast/.github/scripts/local-core.sh
          python3 "$FORGE_SCRIPTS/companion_fetch.py" env --root . --ecosystems="rust swift"
          python3 "$FORGE_SCRIPTS/companion_fetch.py" wire --root . --ecosystems=rust
          python3 "$FORGE_SCRIPTS/companion_wire.py" swift --root . --source
      - name: Build the core from this commit
        if: matrix.build-mode == 'manual'
        env:
          FORGE: ${{ github.workspace }}/.hyperforge
        run: .github/scripts/local-core.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # From the root Package.swift, the one consumers resolve; its HyperTabular target is the
      # same sources as swift/Package.swift's, now linking the core built above.
      - name: Build the Swift library
        if: matrix.build-mode == 'manual'
        run: swift build --target HyperTabular

      # Builds the autobuild languages and uploads every language's SARIF, once each, under the
      # same `/language:<lang>` category default setup used.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
