[build-system]
# 1.15 is the first maturin that builds PyO3 0.30's abi3t extension correctly (its
# PyModExport entry point; abi3t support itself came in 1.14), and it reads PEP 639's SPDX
# `license` string and top-level `license-files` below, which needed 1.9.
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "hypertabular"
# Baked from rust/Cargo.toml at build time by maturin (manifest-path below) — the one
# version source of truth, no second literal to drift.
dynamic = ["version"]
description = "Delimited text — CSV, TSV, any single-byte separator — and XLSX/ODS workbooks read a batch at a time into typed columns, with a HyperCast verdict for every cell. A PyO3 native extension linking a Rust core directly into CPython: the boundary is crossed once per batch, columns arrive as typed memoryviews rather than a call per cell, and no compiler is needed to install."
# The package page on PyPI: this binding's own README, not the repo root's.
readme = "README.md"
license = "MIT"
# A local copy, not a path up to the repo root: PEP 639 globs forbid `..` outright.
license-files = ["LICENSE"]
authors = [{ name = "Brian Buvinghausen" }]
# 3.11 floor, as HyperCast's package: `match`/`case` over Success | Fault, `typing.assert_never`
# in the standard library, and the extension is built abi3-py311, so one wheel per platform
# covers the whole floor-and-up range with the GIL. Free-threaded CPython takes a cp314t
# wheel and, from 3.15, the abi3t one (rust/Cargo.toml's abi3t-py315).
requires-python = ">=3.11"
# HyperCast is the judge, in Python as in the core: a cell is `hypercast.Success` or
# `hypercast.Fault` — that package's own classes, built by calling them — and a plan
# column's notation is its `NumFormat`. 0.9.0, the first with free-threaded wheels (an
# interpreter with the GIL off needs both extensions to declare they can run without it),
# and below 0.10 because a 0.x minor is where its surface is allowed to move.
dependencies = ["hypercast>=0.9.0,<0.10"]
keywords = ["csv", "tsv", "parsing", "verdict", "pyo3"]
# No `License ::` classifier: PEP 639 deprecates them in favour of the `license` expression
# above, and the two are not meant to be declared together.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SkunkWerkx/HyperTabular"
Repository = "https://github.com/SkunkWerkx/HyperTabular"
Issues = "https://github.com/SkunkWerkx/HyperTabular/issues"

[project.optional-dependencies]
# mypy is what tests/test_typing.py checks a consumer's match with; those tests skip without it.
test = ["pytest>=8.0", "mypy>=1.11"]

[tool.maturin]
manifest-path = "../rust/Cargo.toml"
python-source = "src"
module-name = "hypertabular._native"
features = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# One width for the package and its tests, the Rust core's own (rustfmt.toml).
line-length = 100
# Code only: the README's examples are laid out by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Doc-comment enforcement only, as in HyperCast: the "missing docstring" family of
# pydocstyle rules, not the full convention.
select = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
