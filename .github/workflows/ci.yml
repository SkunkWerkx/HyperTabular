name: CI — build native, test every binding

# The forge's pipeline (SkunkWerkx/.github): the core built fresh on five real-hardware
# legs, both musl RIDs and a cross-built Intel macOS, its own suite run on each, the
# libraries attested and uploaded as `native-{rid}`, the nine static libraries built, and
# every binding this repo has run against that leg's library.
#
# The bindings it does not have yet are switched off below. Each line goes when the PR
# that adds the binding turns it on — that is the whole onboarding.
#
# Beside it, as in HyperCast, the checks that are this repo's own: rust/check-core.sh,
# which proves on the library itself that the core has no standard library, no allocation
# and no panic.
#
# No `push` trigger, as in every Hyper* repo: a PR run and a manual one are enough.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-native:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-native.yml@master
    permissions:            # attestation signs with OIDC; a reusable workflow
      contents: read        # can never escalate beyond its caller's grant
      id-token: write
      attestations: write
    with:
      project: HyperTabular
      crate: hypertabular
      pure_env: HYPERTABULAR_PURE
      csharp_test_project: csharp/HyperTabular.Tests/HyperTabular.Tests.csproj
      csharp_aot_project: csharp/HyperTabular.AotSmokeTest/HyperTabular.AotSmokeTest.csproj
      csharp_runtimes_dir: csharp/HyperTabular/runtimes
      dotnet_version: "11.0.x"
      dotnet_quality: "preview"
      # Explicit placement, as HyperCast does it: the forge puts this leg's library at
      # src/main/resources/native/{rid}/ — where the shipped jar carries it — and the
      # Gradle dev loop, which would otherwise stage whatever rust/target/release holds
      # by then, stands down.
      java_resources_dir: java/src/main/resources/native
      # Not written yet. Each comes on with its binding.
      magnus: false

  check-core:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7

      # The other architecture's library is only type-checked, which needs its target
      # and nothing else: nothing is linked for it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools
          targets: thumbv7em-none-eabi, x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu

      - name: The core is no_std, allocation-free and panic-free
        run: ./check-core.sh

      - name: cargo test
        run: cargo test

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --no-default-features --features cdylib -- -D warnings

  # Each binding's formatter and doc linter, every PR, over all of its code — library,
  # tests, benchmarks and smoke tests — against the config committed beside it. Static analysis only,
  # no native build needed. (Rust's are check-core's cargo fmt and clippy.)
  lint-go:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go install github.com/mgechev/revive@v1.16.0
      - working-directory: go
        run: revive -config revive.toml ./...
      - name: gofmt
        working-directory: go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted (run gofmt -w .): $unformatted"
            exit 1
          fi

  lint-python:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.5
      # Docstrings and formatting over the whole package (pyproject.toml's [tool.ruff]).
      - working-directory: python
        run: ruff check .
      - working-directory: python
        run: ruff format --check .

  lint-php:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ffi
      - working-directory: php
        run: composer install --no-progress --prefer-dist
      # phpcs.xml: PSR-12 over src and tests, doc comments on the public API.
      - working-directory: php
        run: vendor/bin/phpcs

  lint-ruby:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ruby
      - working-directory: ruby
        run: bundle exec rake docs:check
      # .rubocop.yml: layout only, over every Ruby file in the gem.
      - working-directory: ruby
        run: bundle exec rubocop

  format-csharp:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-quality: preview
      # csharp/.editorconfig: tabs, LF, a final newline.
      - working-directory: csharp
        run: dotnet format whitespace HyperTabular.slnx --verify-no-changes

  format-java:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # Spotless with palantir-java-format (java/build.gradle.kts).
      - working-directory: java
        run: ./gradlew --no-daemon spotlessCheck

  format-swift:
    runs-on: ubuntu-26.04
    # swift-format ships in the toolchain, so the formatter is the version of the Swift the
    # matrix builds with (the forge's swift_version).
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      # swift/.swift-format: 4-space indent, 120 columns, every lint rule off — layout only.
      - working-directory: swift
        run: >-
          swift format lint --strict --recursive
          Package.swift Sources Tests
          StaticSmokeTest/Package.swift StaticSmokeTest/Sources
          Benchmarks/Package.swift Benchmarks/Benchmarks

