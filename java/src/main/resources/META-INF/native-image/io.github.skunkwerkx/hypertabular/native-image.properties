# Native.Downcalls (the FFM Native, JDK 25's tree of the multi-release jar) holds the downcall
# handles and nothing that needs the native library. Initialized when the image is built, they
# are constants in the image and Native Image compiles the calls through them; left to
# initialize at run time, every call goes through the method-handle interpreter instead.
Args = --initialize-at-build-time=io.github.skunkwerkx.hypertabular.Native$Downcalls
